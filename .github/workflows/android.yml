name: Android APK build
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare the pinned Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build the release variant and instrumented tests
        run: npm run build:android -- assembleRelease assembleReleaseAndroidTest lintRelease
      - name: Verify the bundled game
        run: npm run verify:apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the release WebView on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb -s emulator-5554 shell wm size 854x480
            adb -s emulator-5554 shell wm density 160
            npm run test:android -- emulator-5554
      - name: Preserve device reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-qa
          path: output/qa/
