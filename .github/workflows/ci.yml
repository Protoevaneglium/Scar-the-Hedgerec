name: Cross-Platform CI (Linux, macOS, Windows, Termux/Zero-Dep)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate Zero-Dependency Server Entry Point (Termux/Android Compat)
        run: node -c server.js
      - name: Run 26-Test Sonic Physics & Stage Verification Suite (Zero-Dep)
        run: npm test
      - name: Install Optional Dependencies & Re-Verify
        run: |
          npm install
          npm test
