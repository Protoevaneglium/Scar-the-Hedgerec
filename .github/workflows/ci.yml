name: Cross-Platform CI (Linux, macOS, Windows, Termux/Zero-Dep)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate Zero-Dependency Server Entry Point (Termux/Android Compat)
        run: node -c server.js
      - name: Verify game, controls, HTTP server and starter package (Zero-Dep)
        run: npm test
      - name: Install Optional Dependencies & Re-Verify
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Install browser for local-server controller checks
        run: npx playwright install --with-deps chromium
      - name: Exercise controllers in the real local-server browser
        run: npm run test:gamepad-browser -- chromium
      - name: Install WebKit on macOS
        if: runner.os == 'macOS'
        run: npx playwright install webkit
      - name: Exercise controllers in WebKit on macOS
        if: runner.os == 'macOS'
        run: npm run test:gamepad-browser -- webkit
      - name: Preserve browser controller reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-${{ runner.os }}
          path: output/qa/controller-*
