<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scar the Hedgerec</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; }
        #canvas-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #050b14; }
        canvas { display: block; box-shadow: 0 0 40px rgba(0, 0, 0, 0.85); image-rendering: pixelated; }
        #top-bar { position: absolute; top: 10px; right: 14px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 10; justify-content: flex-end; max-width: 68%; }
        .chip { background: rgba(10, 20, 40, 0.88); border: 1px solid rgba(80, 160, 255, 0.55); color: #9cdcfe; padding: 5px 10px;
                border-radius: 6px; font: bold 11px 'Courier New', monospace; cursor: pointer; transition: background 0.12s; }
        .chip:hover { background: rgba(30, 60, 120, 0.92); color: #fff; }
        .chip.on { background: #1976d2; color: #fff; border-color: #90caf9; }
        .chip.gold { background: rgba(180, 100, 10, 0.9); color: #ffe57f; border-color: #ffd54f; }
        #touch { position: absolute; bottom: 20px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 30px; pointer-events: none; z-index: 10; }
        @media (pointer: coarse) { #touch { display: flex; } }
        .tgroup { display: flex; gap: 12px; pointer-events: auto; }
        .tbtn { width: 62px; height: 62px; border-radius: 31px; background: rgba(20, 40, 80, 0.6); border: 2px solid rgba(100, 180, 255, 0.6);
                color: #fff; font-size: 20px; font-weight: bold; touch-action: none; }
        .tbtn.active { background: rgba(40, 120, 240, 0.85); border-color: #fff; }
        .tbtn.jump { width: 76px; height: 76px; border-radius: 38px; background: rgba(220, 40, 40, 0.65); border-color: rgba(255, 140, 140, 0.8); font-size: 16px; }
    </style>
</head>
<body>
<div id="canvas-container">
    <canvas id="game"></canvas>
    <div id="top-bar">
        <button class="chip gold" id="btn-stage" title="Switch Stage (M)">Stage: Act 1</button>
        <button class="chip on" id="btn-era" title="Cycle Time Era (T)">Time: Good Future</button>
        <button class="chip" id="btn-hud" title="Tab / G">Debug Sensors: OFF</button>
        <button class="chip on" id="btn-audio">Audio: ON</button>
        <button class="chip" id="btn-cp" title="Keys 1–7">Checkpoint: Cliff & Slide (1)</button>
        <button class="chip" id="btn-reset" title="R">Reset (R)</button>
    </div>
    <div id="touch">
        <div class="tgroup">
            <button class="tbtn" data-key="left">◀</button>
            <button class="tbtn" data-key="down">▼</button>
            <button class="tbtn" data-key="right">▶</button>
        </div>
        <div class="tgroup"><button class="tbtn jump" data-key="jump">JUMP</button></div>
    </div>
</div>

<script src="sonic-engine.js"></script>
<script>
'use strict';
const { PHYS, HITBOX, STATE, Terrain, Player, MODE_FRAMES, PALMTREE_SPRITES, toDeg, TAU } = window.SonicEngine;

/* ==========================================================================
   AUDIO — 16-Bit Sega CD / Genesis Web Audio Synthesizer
   ========================================================================== */
class RetroAudio {
    constructor() { this.ctx = null; this.enabled = true; this.lastSkid = 0; }
    unlock() {
        if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(type, f0, f1, dur, vol = 0.14, delay = 0) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
    }
    noise(dur, freq, vol = 0.12) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
        src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
        src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t);
    }
    jump() { this.tone('square', 320, 760, 0.16, 0.12); }
    roll() { this.noise(0.12, 900, 0.1); }
    rev(r) { this.tone('sawtooth', 240 + r * 50, 380 + r * 60, 0.1, 0.12); }
    release() { this.tone('triangle', 700, 200, 0.25, 0.2); this.noise(0.2, 600, 0.12); }
    land() { this.tone('sine', 150, 50, 0.08, 0.14); }
    bonk() { this.tone('square', 180, 90, 0.08, 0.1); }
    skid(now) { if (now - this.lastSkid > 90) { this.lastSkid = now; this.noise(0.09, 1500, 0.1); } }
    ring() {
        this.tone('sine', 987.77, 987.77, 0.07, 0.14, 0);     // B5
        this.tone('sine', 1318.51, 1318.51, 0.18, 0.14, 0.07); // E6
    }
    ringLoss() {
        for (let i = 0; i < 4; i++) this.tone('square', 900 - i * 140, 600 - i * 100, 0.06, 0.09, i * 0.05);
    }
    bouncePole() {
        this.tone('triangle', 260, 880, 0.22, 0.18, 0);
        this.tone('square', 420, 660, 0.14, 0.10, 0.04);
    }
    spinner() {
        this.tone('sine', 660, 1320, 0.10, 0.15, 0);
        this.tone('triangle', 990, 1480, 0.12, 0.12, 0.05);
    }
    shatter() {
        this.noise(0.22, 420, 0.18);
        this.tone('sawtooth', 220, 65, 0.18, 0.15, 0);
    }
    boost() {
        this.tone('sawtooth', 300, 1100, 0.24, 0.16, 0);
        this.noise(0.18, 1200, 0.12);
    }
    timePost() {
        this.tone('square', 523.25, 1046.5, 0.12, 0.14, 0);
        this.tone('square', 659.25, 1318.5, 0.16, 0.14, 0.08);
    }
    timeWarp() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((n, i) => this.tone('triangle', n, n * 1.2, 0.14, 0.16, i * 0.06));
    }
    goalPost() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        notes.forEach((n, i) => this.tone('square', n, n, 0.12, 0.14, i * 0.09));
    }
}
const audio = new RetroAudio();

/* ==========================================================================
   INPUT — Left, Right, Down, Jump, Stage/Time/Debug toggles & Checkpoints
   ========================================================================== */
class InputHandler {
    constructor() {
        this.left = this.right = this.down = this.jumpHeld = false;
        this.jumpPressed = false;
        this.debugToggle = false;
        this.actions = [];
        const KEY = {
            ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
            Space: 'jump', KeyZ: 'jump', KeyX: 'jump', KeyC: 'jump',
        };
        const SWALLOW = new Set([...Object.keys(KEY), 'ArrowUp', 'Tab']);
        window.addEventListener('keydown', (e) => {
            audio.unlock();
            if (SWALLOW.has(e.code)) e.preventDefault();
            const k = KEY[e.code];
            if (k) this.press(k, true);
            if (e.repeat) return;
            if (e.code === 'Tab' || e.code === 'KeyG') this.debugToggle = true;
            if (e.code === 'KeyR') this.actions.push({ type: 'reset' });
            if (e.code === 'KeyM') this.actions.push({ type: 'stage' });
            if (e.code === 'KeyT') this.actions.push({ type: 'era' });
            const m = /^Digit([1-7])$/.exec(e.code);
            if (m) this.actions.push({ type: 'checkpoint', index: +m[1] - 1 });
        });
        window.addEventListener('keyup', (e) => {
            if (SWALLOW.has(e.code)) e.preventDefault();
            const k = KEY[e.code];
            if (k) this.press(k, false);
        });
        window.addEventListener('blur', () => { this.left = this.right = this.down = this.jumpHeld = false; });
        document.querySelectorAll('.tbtn').forEach((el) => {
            const k = el.dataset.key;
            const on = (e) => { e.preventDefault(); audio.unlock(); el.classList.add('active'); this.press(k, true); };
            const off = (e) => { e.preventDefault(); el.classList.remove('active'); this.press(k, false); };
            el.addEventListener('pointerdown', on);
            ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, off));
        });
    }
    press(k, down) {
        if (k === 'jump') { if (down && !this.jumpHeld) this.jumpPressed = true; this.jumpHeld = down; }
        else this[k] = down;
    }
    snapshot() { return { left: this.left, right: this.right, down: this.down, jumpHeld: this.jumpHeld, jumpPressed: this.jumpPressed }; }
    endFrame() { this.jumpPressed = false; this.debugToggle = false; this.actions.length = 0; }
}

/* ==========================================================================
   GAME — Palmtree Panic Renderer, Sprite Atlas, Camera & HUD
   ========================================================================== */
const SENSOR_COLORS = { A: '#00ff6a', B: '#d4ff00', C: '#00d0ff', D: '#5b7cff', E: '#ff66cc', F: '#ff4040' };
const MODE_NAMES = ['Floor', 'Right Wall', 'Ceiling', 'Left Wall'];
const BLUE = '#1f4fe0', BLUE_D = '#12329a', PEACH = '#f6c08e', RED = '#e02424';
const ERAS = ['good_future', 'present', 'past'];
const ERA_LABELS = { good_future: 'Good Future', present: 'Present', past: 'Past' };

class Game {
    constructor() {
        this.canvas = document.getElementById('game');
        this.ctx = this.canvas.getContext('2d');
        this.W = 960; this.H = 540;
        this.canvas.width = this.W; this.canvas.height = this.H;
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Load Sonic CD Palmtree Panic Good Future sprite sheet & full zone map
        this.objSheet = new Image();
        this.objSheetLoaded = false;
        this.objSheet.onload = () => { this.objSheetLoaded = true; };
        this.objSheet.src = 'assets/palmtree_objects.png';

        this.mapImg = new Image();
        this.mapImgLoaded = false;
        this.mapImg.onload = () => { this.mapImgLoaded = true; };
        this.mapImg.src = 'assets/palmtree_map.png';

        this.input = new InputHandler();
        this.showDebug = false;
        this.stageName = 'palmtree';
        this.stageTime = 0;

        this.patterns = {
            palmtreeRock: this.makePalmtreeRockPattern(),
            palmtreeLoop: this.makePalmtreeLoopPattern(),
            checker: this.makeChecker('#b0601e', '#8a4614', 16),
            loopChecker: this.makeChecker('#c46b22', '#94501a', 12),
            rock: this.makeChecker('#6b3a17', '#5a3013', 20),
        };

        this.loadStage('palmtree');
        this.setupUI();

        this.fps = 60; this.fpsFrames = 0; this.fpsTime = 0; this.dt60 = 1;
        this.last = performance.now();
        requestAnimationFrame((t) => this.frame(t));
    }

    loadStage(stageName) {
        this.stageName = stageName;
        this.terrain = new Terrain(stageName);
        this.particles = [];
        this.cpIndex = 0;
        this.stageTime = 0;

        this.player = new Player(this.terrain, {
            jump: () => audio.jump(),
            roll: () => audio.roll(),
            bonk: () => audio.bonk(),
            spindashRev: (rev, p) => { audio.rev(rev); this.dust(p, 5, -p.facing, 2.5); },
            spindashRelease: (v, p) => { audio.release(); this.dust(p, 8, -p.facing, 3.5); },
            land: (d, p) => { audio.land(); if (d.ysp > 4) { this.dust(p, 3, 1, 1.5); this.dust(p, 3, -1, 1.5); } },
            respawn: (cp) => {
                this.cpIndex = Math.max(0, this.terrain.checkpoints.indexOf(cp));
                this.updateCpButton();
                this.snapCamera();
            },
            ring: () => audio.ring(),
            ringLoss: () => audio.ringLoss(),
            bouncePole: (bp, p) => { audio.bouncePole(); this.dust(p, 6, 1, 2.2); },
            spinner: () => audio.spinner(),
            breakWall: () => audio.shatter(),
            breakRock: () => audio.shatter(),
            breakFloor: () => audio.shatter(),
            houdini: () => audio.spinner(),
            enemyPop: () => audio.spinner(),
            boost: (sb, p) => { audio.boost(); this.dust(p, 10, -p.facing, 3.8); },
            timePost: () => audio.timePost(),
            timeWarp: () => { audio.timeWarp(); this.updateEraButton(); },
            goalPost: () => audio.goalPost(),
        });

        this.camX = 0; this.camY = 0; this.look = 0;
        this.snapCamera();
        this.updateStageButtons();
    }

    resize() {
        const c = document.getElementById('canvas-container');
        const s = Math.min(c.clientWidth / this.W, c.clientHeight / this.H);
        this.canvas.style.width = Math.floor(this.W * s) + 'px';
        this.canvas.style.height = Math.floor(this.H * s) + 'px';
    }

    /** Authentic Sonic CD Palmtree Panic bevelled golden/orange striped & triangle-carved rock pattern. */
    makePalmtreeRockPattern() {
        const cv = document.createElement('canvas');
        cv.width = 64; cv.height = 64;
        const g = cv.getContext('2d');
        // Rich dark brown base
        g.fillStyle = '#3c1800'; g.fillRect(0, 0, 64, 64);
        // Horizontal bevelled Sonic CD golden-orange rock strata
        const bands = [
            [0, 6, '#fca800'], [6, 8, '#dc6800'], [14, 4, '#903000'],
            [18, 14, '#581c00'],
            [32, 6, '#fca800'], [38, 8, '#dc6800'], [46, 4, '#903000'],
            [50, 14, '#581c00'],
        ];
        for (const [y, h, col] of bands) { g.fillStyle = col; g.fillRect(0, y, 64, h); }
        // Carved Sonic CD geometric triangles inside the dark strata
        for (let row = 0; row < 2; row++) {
            const y0 = row * 32 + 16;
            for (let x = 0; x < 64; x += 16) {
                g.fillStyle = '#b44800';
                g.beginPath(); g.moveTo(x, y0); g.lineTo(x + 16, y0); g.lineTo(x + 8, y0 + 14); g.closePath(); g.fill();
                g.fillStyle = '#fc9800';
                g.beginPath(); g.moveTo(x + 2, y0); g.lineTo(x + 8, y0); g.lineTo(x + 8, y0 + 11); g.closePath(); g.fill();
            }
        }
        return this.ctx.createPattern(cv, 'repeat');
    }

    makePalmtreeLoopPattern() {
        const cv = document.createElement('canvas');
        cv.width = 32; cv.height = 32;
        const g = cv.getContext('2d');
        g.fillStyle = '#a83c00'; g.fillRect(0, 0, 32, 32);
        for (let y = 0; y < 32; y += 16) {
            for (let x = 0; x < 32; x += 16) {
                g.fillStyle = '#fca800';
                g.beginPath(); g.moveTo(x, y); g.lineTo(x + 16, y); g.lineTo(x + 8, y + 16); g.closePath(); g.fill();
                g.fillStyle = '#dc6800';
                g.beginPath(); g.moveTo(x + 8, y); g.lineTo(x + 16, y); g.lineTo(x + 8, y + 16); g.closePath(); g.fill();
            }
        }
        return this.ctx.createPattern(cv, 'repeat');
    }

    makeChecker(a, b, size) {
        const cv = document.createElement('canvas');
        cv.width = cv.height = size * 2;
        const g = cv.getContext('2d');
        g.fillStyle = a; g.fillRect(0, 0, size * 2, size * 2);
        g.fillStyle = b; g.fillRect(0, 0, size, size); g.fillRect(size, size, size, size);
        return this.ctx.createPattern(cv, 'repeat');
    }

    setupUI() {
        const stg = document.getElementById('btn-stage');
        const era = document.getElementById('btn-era');
        const hud = document.getElementById('btn-hud');
        const aud = document.getElementById('btn-audio');
        const cp = document.getElementById('btn-cp');
        const rst = document.getElementById('btn-reset');
        const blurAfter = (el, fn) => el.addEventListener('click', () => { audio.unlock(); fn(); el.blur(); });
        blurAfter(stg, () => this.toggleStage());
        blurAfter(era, () => this.cycleEra());
        blurAfter(hud, () => this.toggleDebug());
        blurAfter(aud, () => { audio.enabled = !audio.enabled; aud.textContent = `Audio: ${audio.enabled ? 'ON' : 'OFF'}`; aud.classList.toggle('on', audio.enabled); });
        blurAfter(cp, () => this.gotoCheckpoint((this.cpIndex + 1) % this.terrain.checkpoints.length));
        blurAfter(rst, () => {
            if (this.terrain.stage === 'palmtree') this.terrain.setupPalmtreeObjects();
            this.player.rings = 0; this.player.score = 0; this.stageTime = 0;
            this.gotoCheckpoint(0);
        });
    }

    toggleStage() {
        this.loadStage(this.stageName === 'palmtree' ? 'test' : 'palmtree');
    }
    cycleEra() {
        const idx = (ERAS.indexOf(this.terrain.timeEra) + 1) % ERAS.length;
        this.terrain.timeEra = ERAS[idx];
        this.terrain.timeWarpFlash = 18;
        audio.timePost();
        this.updateEraButton();
    }
    updateStageButtons() {
        const stg = document.getElementById('btn-stage');
        if (stg) stg.textContent = `Stage: ${this.stageName === 'palmtree' ? 'Act 1' : 'Physics Test'}`;
        this.updateEraButton();
        this.updateCpButton();
    }
    updateEraButton() {
        const era = document.getElementById('btn-era');
        if (era) era.textContent = `Time: ${ERA_LABELS[this.terrain.timeEra] || 'Good Future'}`;
    }
    toggleDebug() {
        this.showDebug = !this.showDebug;
        const b = document.getElementById('btn-hud');
        b.textContent = `Debug Sensors: ${this.showDebug ? 'ON' : 'OFF'}`;
        b.classList.toggle('on', this.showDebug);
    }
    gotoCheckpoint(i) {
        this.cpIndex = i % this.terrain.checkpoints.length;
        const c = this.terrain.checkpoints[this.cpIndex];
        this.player.place(c.x, 0, c.y);
        this.particles.length = 0;
        this.updateCpButton();
        this.snapCamera();
    }
    updateCpButton() {
        const c = this.terrain.checkpoints[this.cpIndex] || this.terrain.checkpoints[0];
        document.getElementById('btn-cp').textContent = `Checkpoint: ${c.name} (${this.cpIndex + 1})`;
    }

    /* ---------------- main loop ---------------- */
    frame(now) {
        const dt = Math.min((now - this.last) / 1000, 0.05);
        this.last = now;
        this.dt60 = dt * 60;
        this.fpsFrames++; this.fpsTime += dt;
        if (this.fpsTime >= 0.5) { this.fps = Math.round(this.fpsFrames / this.fpsTime); this.fpsFrames = 0; this.fpsTime = 0; }

        if (this.input.debugToggle) this.toggleDebug();
        for (const a of this.input.actions) {
            if (a.type === 'reset') {
                if (this.terrain.stage === 'palmtree') this.terrain.setupPalmtreeObjects();
                this.player.rings = 0; this.player.score = 0; this.stageTime = 0;
                this.gotoCheckpoint(0);
            }
            if (a.type === 'stage') this.toggleStage();
            if (a.type === 'era') this.cycleEra();
            if (a.type === 'checkpoint') this.gotoCheckpoint(a.index);
        }

        if (!this.terrain.goalPost || !this.terrain.goalPost.cleared) {
            this.stageTime += dt;
        }

        this.player.update(this.input.snapshot(), dt);
        this.input.endFrame();

        const p = this.player;
        if (p.skidding) { audio.skid(now); if (Math.random() < 0.5 * this.dt60) this.dust(p, 1, p.facing, 1.5); }
        if (p.state === STATE.SPINDASH && Math.random() < 0.4 * this.dt60) this.dust(p, 1, -p.facing, 2);
        this.updateParticles(this.dt60);
        this.updateCamera(dt);
        this.render();
        requestAnimationFrame((t) => this.frame(t));
    }

    /* ---------------- particles ---------------- */
    dust(p, n, dir, speed) {
        const fr = MODE_FRAMES[p.mode], h = p.radii.height;
        const fx = p.x + fr.dx * (h - 2), fy = p.y + fr.dy * (h - 2);
        for (let i = 0; i < n; i++) {
            const s = speed * (0.5 + Math.random());
            this.particles.push({
                x: fx, y: fy,
                vx: fr.rx * dir * s - fr.dx * Math.random(), vy: fr.ry * dir * s - fr.dy * Math.random(),
                life: 14 + Math.random() * 10, max: 24, size: 2 + Math.random() * 3,
            });
        }
    }
    updateParticles(d) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const q = this.particles[i];
            q.x += q.vx * d; q.y += q.vy * d; q.vx *= Math.pow(0.92, d); q.vy *= Math.pow(0.92, d);
            q.life -= d;
            if (q.life <= 0) this.particles.splice(i, 1);
        }
    }

    /* ---------------- smooth look-ahead camera ---------------- */
    snapCamera() {
        this.look = 0;
        this.camX = Math.max(0, this.player.x - this.W / 2);
        this.camY = this.player.y - this.H / 2 + 25;
    }
    updateCamera(dt) {
        const p = this.player;
        const vx = p.grounded ? p.gsp * Math.cos(p.angle) : p.xsp;
        const targetLook = Math.max(-150, Math.min(160, vx * 16));
        this.look += (targetLook - this.look) * (1 - Math.exp(-2.8 * dt));
        const tx = Math.max(0, Math.min(this.terrain.endX - this.W, p.x + this.look - this.W / 2));
        const ty = Math.max(-140, Math.min(420, p.y - this.H / 2 + 25));
        this.camX += (tx - this.camX) * (1 - Math.exp(-9 * dt));
        this.camY += (ty - this.camY) * (1 - Math.exp(-6.5 * dt));
    }

    /** Helper to draw a sprite rect from `assets/palmtree_objects.png`. */
    drawSprite(ctx, rect, dx, dy, dw = rect.w, dh = rect.h, flipX = false) {
        if (!this.objSheetLoaded || !rect) return false;
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        if (flipX) {
            ctx.translate(dx + dw, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(this.objSheet, rect.x, rect.y, rect.w, rect.h, 0, 0, dw, dh);
        } else {
            ctx.drawImage(this.objSheet, rect.x, rect.y, rect.w, rect.h, dx, dy, dw, dh);
        }
        ctx.restore();
        return true;
    }

    /* ======================================================================
       RENDER
       ====================================================================== */
    render() {
        const ctx = this.ctx;
        this.drawBackground(ctx);
        ctx.save();
        ctx.translate(-Math.round(this.camX), -Math.round(this.camY));
        this.view = { x0: this.camX - 80, x1: this.camX + this.W + 80, y0: this.camY - 80, y1: this.camY + this.H + 80 };

        if (this.terrain.stage === 'palmtree') {
            this.drawWaterfallsBack(ctx);
            this.drawTunnelsBack(ctx);
            this.drawSceneryProps(ctx);
            this.drawLoops(ctx);
            for (const f of this.terrain.floors) this.drawFloor(ctx, f);
            this.drawTunnelsRock(ctx);
            this.drawWaterSurface(ctx);
            this.drawPalmtreeObjects(ctx);
            this.drawSigns(ctx);
        } else {
            this.drawPit(ctx);
            this.drawTunnelsBack(ctx);
            this.drawLegacyProps(ctx);
            this.drawLoops(ctx);
            for (const f of this.terrain.floors) this.drawFloor(ctx, f);
            this.drawTunnelsRock(ctx);
            this.drawSigns(ctx);
        }

        if (this.showDebug) this.drawLoopDebug(ctx);
        this.drawParticles(ctx);
        this.drawPlayer(ctx);
        if (this.showDebug) this.drawSensors(ctx);
        ctx.restore();

        if (this.terrain.timeWarpFlash > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${(this.terrain.timeWarpFlash / 35).toFixed(2)})`;
            ctx.fillRect(0, 0, this.W, this.H);
        }

        this.drawSonicCDHUD(ctx);
        if (this.terrain.stage === 'palmtree') this.drawZoneMapRadar(ctx);
        if (this.showDebug) this.drawHUD(ctx);
        this.drawControlsHint(ctx);
    }

    drawBackground(ctx) {
        const W = this.W, H = this.H;
        const era = this.terrain.timeEra || 'good_future';
        const t = performance.now();
        const horizon = Math.round(290 - (this.camY - 300) * 0.06);
        const waterY = horizon + 40;

        // 1. RETRO 16-BIT BANDED & DITHERED CYBER SKY
        const palettes = {
            good_future: {
                bands: ['#070b28', '#0e1d52', '#163888', '#1d5ec4', '#268ef0', '#48b8ff', '#8cf0ff'],
                neonA: '#00f6ff', neonB: '#ff2a9d', neonC: '#ffe640',
                sunCore: '#fff8c8', sunMid: '#ff48b0', sunBot: '#00f0ff',
                mtnFar: '#16466c', mtnFarHi: '#2478a0', mtnMid: '#187c64', mtnMidHi: '#34c890',
                cliffDark: '#4a2c48', cliffLight: '#884c78',
                waterBands: ['#1898f8', '#1278d8', '#0c58b4', '#083c8c', '#052464'],
                gridColor: 'rgba(0, 246, 255, 0.24)'
            },
            past: {
                bands: ['#18082c', '#32104c', '#581c68', '#882c70', '#bc4868', '#e87058', '#fcb060'],
                neonA: '#ff9040', neonB: '#ff2878', neonC: '#ffe070',
                sunCore: '#fff0b8', sunMid: '#ff6830', sunBot: '#c81868',
                mtnFar: '#3c1e4c', mtnFarHi: '#683468', mtnMid: '#385838', mtnMidHi: '#609048',
                cliffDark: '#48242c', cliffLight: '#7c4438',
                waterBands: ['#783488', '#5c2470', '#421858', '#2c0e40', '#1a0828'],
                gridColor: 'rgba(255, 120, 80, 0.22)'
            },
            present: {
                bands: ['#050820', '#0b1848', '#14307c', '#1c50b8', '#2474e4', '#4ca0fc', '#90dcff'],
                neonA: '#00e8ff', neonB: '#ff3898', neonC: '#ffd838',
                sunCore: '#ffffff', sunMid: '#ff3898', sunBot: '#00d8ff',
                mtnFar: '#183c68', mtnFarHi: '#286498', mtnMid: '#1c6c4c', mtnMidHi: '#30a868',
                cliffDark: '#4c2c38', cliffLight: '#804c54',
                waterBands: ['#1878e0', '#125cb8', '#0c4494', '#082e70', '#051c4c'],
                gridColor: 'rgba(0, 232, 255, 0.20)'
            }
        };
        const pal = palettes[era] || palettes.good_future;

        ctx.save();
        // Draw stepped 16-bit sky color bands with classic Sega CD scanline dithering at transitions
        const bandCount = pal.bands.length;
        const skyH = Math.max(80, waterY);
        const bandH = Math.ceil(skyH / bandCount);
        for (let i = 0; i < bandCount; i++) {
            const by = i * bandH;
            ctx.fillStyle = pal.bands[i];
            ctx.fillRect(0, by, W, bandH + 2);
            // Retro 2px scanline dither between adjacent bands
            if (i > 0) {
                ctx.fillStyle = pal.bands[i - 1];
                ctx.fillRect(0, by, W, 2);
                ctx.fillRect(0, by + 4, W, 2);
                ctx.fillRect(0, by + 8, W, 1);
            }
        }

        // Upper-sky retro pixel stars & glowing cyber data nodes
        const starScroll = -(this.camX * 0.015);
        for (let i = 0; i < 36; i++) {
            const sx = ((i * 97 + Math.floor(starScroll)) % W + W) % W;
            const sy = 10 + ((i * 53) % Math.max(40, Math.floor(skyH * 0.48)));
            const blink = Math.sin(t * 0.004 + i * 1.9);
            if (blink > -0.3) {
                ctx.fillStyle = (i % 5 === 0) ? pal.neonA : (i % 7 === 0) ? pal.neonB : '#ffffff';
                const sz = (i % 4 === 0 && blink > 0.5) ? 3 : 2;
                ctx.fillRect(sx, sy, sz, sz);
                if (i % 9 === 0 && blink > 0.4) {
                    ctx.fillRect(sx - 2, sy + 1, 6, 1);
                    ctx.fillRect(sx + 1, sy - 2, 1, 6);
                }
            }
        }

        // Subtle upper-sky cyber wireframe dome arcs
        ctx.strokeStyle = pal.gridColor;
        ctx.lineWidth = 1;
        const gridScroll = -((this.camX * 0.02 + t * 0.008) % 80);
        for (let gx = gridScroll - 80; gx < W + 80; gx += 80) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx + (gx - W * 0.5) * 0.35, Math.floor(skyH * 0.42));
            ctx.stroke();
        }
        for (let gy = 22; gy < skyH * 0.42; gy += 22) {
            ctx.fillStyle = pal.gridColor;
            ctx.fillRect(0, gy, W, 1);
        }

        // 2. SYNTH-CYBER HOLOGRAPHIC PLANET / RETRO SUN IN SKY
        const sunX = Math.round(W * 0.76 - ((this.camX * 0.012) % 300));
        const sunY = Math.round(horizon - 135);
        const sunR = 46;
        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunR, sunX, sunY + sunR);
        sunGrad.addColorStop(0, pal.sunCore);
        sunGrad.addColorStop(0.55, pal.sunMid);
        sunGrad.addColorStop(1, pal.sunBot);
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, TAU);
        ctx.fill();
        // Retro horizontal scanline cutouts on lower half of sun
        ctx.fillStyle = pal.bands[Math.min(bandCount - 1, 3)];
        for (let sy = sunY + 4, step = 1; sy < sunY + sunR; sy += 6, step++) {
            ctx.fillRect(sunX - sunR - 2, sy, (sunR + 2) * 2, Math.min(4, step));
        }
        // Glowing orbital cyber ring around the planet/sun
        ctx.strokeStyle = pal.neonA;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(sunX, sunY + 4, sunR + 26, 9, -0.18, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = pal.neonB;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(sunX, sunY + 4, sunR + 32, 12, -0.18, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // 3. MULTI-PARALLAX STEPPED 16-BIT PIXEL CLOUDS WITH NEON RIMS
        const drawCyberCloud = (cx, cy, scale, neonRim) => {
            const u = Math.round(4 * scale);
            // Neon cyber under-glow rim
            ctx.fillStyle = neonRim;
            ctx.fillRect(cx - u * 7, cy + u * 2, u * 14, u);
            // 16-bit lavender/blue shadow underside
            ctx.fillStyle = era === 'past' ? '#b86888' : '#78a8e8';
            ctx.fillRect(cx - u * 7, cy + u, u * 14, u);
            ctx.fillRect(cx - u * 5, cy, u * 10, u);
            // Crisp white stepped pixel cloud body
            ctx.fillStyle = era === 'past' ? '#ffe4d0' : '#ffffff';
            ctx.fillRect(cx - u * 6, cy, u * 12, u);
            ctx.fillRect(cx - u * 5, cy - u, u * 10, u);
            ctx.fillRect(cx - u * 3, cy - u * 2, u * 6, u);
            ctx.fillRect(cx - u * 1, cy - u * 3, u * 3, u);
        };

        // High fast cloud strip
        const coFast = -((this.camX * 0.07 + t * 0.018) % 320);
        for (let x = coFast - 320; x < W + 320; x += 160) {
            drawCyberCloud(Math.round(x), Math.round(horizon - 195), 1.15, pal.neonA);
        }
        // Mid cloud strip
        const coMid = -((this.camX * 0.045 + t * 0.011) % 260);
        for (let x = coMid - 260; x < W + 260; x += 130) {
            drawCyberCloud(Math.round(x + 40), Math.round(horizon - 140), 0.9, pal.neonB);
        }
        // Low distant horizon cloud strip
        const coSlow = -((this.camX * 0.025 + t * 0.006) % 200);
        for (let x = coSlow - 200; x < W + 200; x += 100) {
            drawCyberCloud(Math.round(x + 20), Math.round(horizon - 95), 0.65, pal.neonA);
        }

        // 4. FAR SKYLINE: PALMTREE PANIC JAGGED PEAKS + CYBER-CITADEL SPIRES & MONORAIL
        const farSpan = 360;
        const farOff = -((this.camX * 0.08) % farSpan);
        for (let base = farOff - farSpan; base < W + farSpan; base += farSpan) {
            const bx = Math.round(base);

            // Elevated neon cyber-monorail bridge spanning between island peaks
            ctx.fillStyle = '#182448';
            ctx.fillRect(bx, horizon - 22, farSpan, 4);
            ctx.fillStyle = pal.neonA;
            ctx.fillRect(bx, horizon - 23, farSpan, 1);
            // Moving light pulse along the monorail
            const trainX = bx + Math.floor(((t * 0.14) % farSpan));
            ctx.fillStyle = pal.neonC;
            ctx.fillRect(trainX, horizon - 25, 18, 2);

            // Stepped Palmtree Panic tropical mountain peak #1
            ctx.fillStyle = pal.mtnFar;
            ctx.beginPath();
            ctx.moveTo(bx + 10, waterY);
            ctx.lineTo(bx + 55, horizon - 78);
            ctx.lineTo(bx + 95, horizon - 78);
            ctx.lineTo(bx + 145, waterY);
            ctx.closePath();
            ctx.fill();
            // 16-bit sunlit right slope highlight
            ctx.fillStyle = pal.mtnFarHi;
            ctx.beginPath();
            ctx.moveTo(bx + 85, horizon - 78);
            ctx.lineTo(bx + 95, horizon - 78);
            ctx.lineTo(bx + 145, waterY);
            ctx.lineTo(bx + 115, waterY);
            ctx.closePath();
            ctx.fill();

            // Cyber-Citadel Spire rising behind the tropical mesa
            const tx = bx + 165;
            ctx.fillStyle = '#141e3c';
            ctx.fillRect(tx, horizon - 112, 34, 112 + 40);
            ctx.fillRect(tx + 6, horizon - 136, 22, 24);
            ctx.fillRect(tx + 15, horizon - 162, 4, 26);
            // Vertical neon circuit strips on the tower
            ctx.fillStyle = pal.neonA;
            ctx.fillRect(tx + 4, horizon - 106, 2, 110);
            ctx.fillRect(tx + 28, horizon - 106, 2, 110);
            ctx.fillStyle = pal.neonB;
            for (let wy = horizon - 100; wy < waterY - 10; wy += 10) {
                ctx.fillRect(tx + 10, wy, 14, 3);
            }
            // Pulsing holographic ring & beacon at spire top
            const beaconPulse = 0.55 + 0.45 * Math.sin(t * 0.006 + base);
            ctx.strokeStyle = pal.neonA;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(tx + 17, horizon - 132, 22, 5, 0, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = beaconPulse > 0.7 ? pal.neonC : pal.neonB;
            ctx.fillRect(tx + 14, horizon - 166, 6, 6);

            // Second stepped tropical peak + cyber pyramid
            ctx.fillStyle = pal.mtnFar;
            ctx.beginPath();
            ctx.moveTo(bx + 210, waterY);
            ctx.lineTo(bx + 265, horizon - 64);
            ctx.lineTo(bx + 335, waterY);
            ctx.closePath();
            ctx.fill();
            // Neon wireframe edge on peak
            ctx.strokeStyle = pal.neonB;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(bx + 210, waterY);
            ctx.lineTo(bx + 265, horizon - 64);
            ctx.lineTo(bx + 335, waterY);
            ctx.stroke();
        }

        // 5. MID SKYLINE: PALMTREE PANIC TERRACED EMERALD ISLANDS, BIO-DOMES & CYBER PALMS
        const midSpan = 260;
        const midOff = -((this.camX * 0.15) % midSpan);
        for (let base = midOff - midSpan; base < W + midSpan; base += midSpan) {
            const ix = Math.round(base);

            // Classic Palmtree Panic rounded emerald hill + stepped cliff terrace
            ctx.fillStyle = pal.mtnMid;
            ctx.beginPath();
            ctx.arc(ix + 115, waterY, 92, Math.PI, 0);
            ctx.fill();

            // 16-bit horizontal sunlit emerald bands on the island dome
            ctx.fillStyle = pal.mtnMidHi;
            for (let band = 12; band < 76; band += 14) {
                const halfW = Math.sqrt(Math.max(0, 92 * 92 - band * band));
                ctx.fillRect(Math.round(ix + 115 - halfW + 8), waterY - band, Math.round(halfW * 1.45), 5);
            }

            // Terraced Palmtree Panic checkered cliff band along island base
            ctx.fillStyle = pal.cliffDark;
            ctx.fillRect(ix + 24, waterY - 22, 182, 22);
            ctx.fillStyle = pal.cliffLight;
            for (let cx = ix + 24; cx < ix + 202; cx += 16) {
                ctx.fillRect(cx, waterY - 22, 8, 11);
                ctx.fillRect(cx + 8, waterY - 11, 8, 11);
            }
            // Neon trim line along terrace ledge
            ctx.fillStyle = pal.neonA;
            ctx.fillRect(ix + 23, waterY - 23, 184, 2);

            // Geodesic Cyber Bio-Dome nestled on the right ridge of the island
            const domeX = ix + 195, domeY = waterY;
            ctx.fillStyle = 'rgba(0, 240, 255, 0.22)';
            ctx.beginPath();
            ctx.arc(domeX, domeY, 44, Math.PI, 0);
            ctx.fill();
            ctx.strokeStyle = pal.neonA;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(domeX, domeY, 44, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(domeX, domeY, 22, 44, 0, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = pal.neonB;
            ctx.fillRect(domeX - 44, domeY - 12, 88, 2);
            ctx.fillRect(domeX - 36, domeY - 26, 72, 2);

            // Distant Neon Waterfall cascading down the island cliff
            const wfX = ix + 108;
            ctx.fillStyle = pal.neonA;
            ctx.fillRect(wfX, waterY - 52, 12, 52);
            ctx.fillStyle = '#ffffff';
            const wfOffset = Math.floor((t * 0.06) % 10);
            for (let wy = waterY - 50 + wfOffset; wy < waterY - 4; wy += 10) {
                ctx.fillRect(wfX + 2, wy, 8, 4);
            }

            // Silhouette Retro Cyber-Palms on the island crest
            const drawCyberPalm = (px, py) => {
                ctx.fillStyle = '#181030';
                for (let seg = 0; seg < 6; seg++) {
                    ctx.fillRect(px + Math.round(Math.sin(seg * 0.4) * 2), py - seg * 5, 4, 4);
                }
                const topX = px + 2, topY = py - 28;
                ctx.strokeStyle = pal.neonC;
                ctx.lineWidth = 2;
                const angles = [-2.6, -2.1, -1.5, -0.9, -0.4];
                for (const a of angles) {
                    ctx.beginPath();
                    ctx.moveTo(topX, topY);
                    ctx.quadraticCurveTo(topX + Math.cos(a) * 12, topY + Math.sin(a) * 10 - 4, topX + Math.cos(a) * 20, topY + Math.sin(a) * 6 + 6);
                    ctx.stroke();
                }
            };
            drawCyberPalm(ix + 68, waterY - 76);
            drawCyberPalm(ix + 148, waterY - 72);
        }

        // 6. SHIMMERING PALMTREE PANIC BAY + RETRO CYBER-GRID HORIZON REFLECTION
        const waterH = Math.max(20, H - waterY);
        const wBandCount = pal.waterBands.length;
        const wBandH = Math.ceil(waterH / wBandCount);
        for (let i = 0; i < wBandCount; i++) {
            const wy = waterY + i * wBandH;
            ctx.fillStyle = pal.waterBands[i];
            ctx.fillRect(0, wy, W, wBandH + 2);
            // 16-bit scanline dither at water band boundary
            if (i > 0) {
                ctx.fillStyle = pal.waterBands[i - 1];
                ctx.fillRect(0, wy, W, 2);
                ctx.fillRect(0, wy + 4, W, 1);
            }
        }

        // Glowing neon horizon waterline bar
        ctx.fillStyle = pal.neonA;
        ctx.fillRect(0, waterY, W, 2);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, waterY, W, 1);

        // Perspective cyber-grid lines shimmering over the tropical bay
        ctx.strokeStyle = pal.gridColor;
        ctx.lineWidth = 1;
        const wGridOff = -((this.camX * 0.22) % 64);
        for (let gx = wGridOff - 64; gx < W + 64; gx += 64) {
            ctx.beginPath();
            ctx.moveTo(gx, waterY + 2);
            ctx.lineTo(gx + (gx - W * 0.5) * 2.2, H);
            ctx.stroke();
        }

        // Multi-speed Sonic CD horizontal water shimmer strips + neon reflections
        for (let y = waterY + 6, i = 0; y < H; y += 10, i++) {
            const speed = 0.18 + i * 0.035;
            const wave = Math.sin(i * 1.5 + t * 0.0035) * 26;
            const o = wave - ((this.camX * speed) % 140);
            const barW = Math.min(76, 26 + i * 4);
            ctx.fillStyle = (i % 3 === 0) ? pal.neonA : (i % 4 === 0) ? pal.neonB : 'rgba(255,255,255,0.55)';
            for (let x = o - 140; x < W + 140; x += 140) {
                ctx.fillRect(Math.round(x), y, barW, 2);
                ctx.fillRect(Math.round(x + barW + 10), y, 8, 2);
            }
        }
        ctx.restore();
    }

    traceField(ctx, s, start = true) {
        const a = Math.max(s.x0, this.view.x0), b = Math.min(s.x1, this.view.x1);
        if (a >= b) return null;
        if (start) ctx.moveTo(a, s.f(a)); else ctx.lineTo(a, s.f(a));
        for (let x = a + 4; x < b; x += 4) ctx.lineTo(x, s.f(x));
        ctx.lineTo(b, s.f(b));
        return [a, b];
    }

    drawFloor(ctx, s) {
        const isPalm = this.terrain.stage === 'palmtree';
        // Elevated oneWay tiers draw as thick Sonic CD cliff shelves (68px deep) so lower caverns remain visible underneath!
        const thickness = s.oneWay ? (s.tier === 'high' ? 54 : 68) : 0;
        ctx.beginPath();
        const r = this.traceField(ctx, s);
        if (!r) return;
        const [a, b] = r;
        if (s.oneWay) {
            for (let x = b; x > a; x -= 6) ctx.lineTo(x, s.f(x) + thickness);
            ctx.lineTo(a, s.f(a) + thickness);
        } else {
            const bottom = this.view.y1 + 60;
            ctx.lineTo(b, bottom); ctx.lineTo(a, bottom);
        }
        ctx.closePath();
        ctx.fillStyle = isPalm ? this.patterns.palmtreeRock : this.patterns.checker;
        ctx.fill();

        if (s.oneWay) {
            ctx.strokeStyle = '#381400'; ctx.lineWidth = 2; ctx.stroke();
        }

        // Vibrant Sonic CD grass band + yellow/green jagged turf teeth along the surface
        ctx.beginPath();
        this.traceField(ctx, s);
        for (let x = b; x > a; x -= 4) ctx.lineTo(x, s.f(x) + 12);
        ctx.lineTo(a, s.f(a) + 12); ctx.closePath();
        ctx.fillStyle = isPalm ? '#00b400' : '#25b52a';
        ctx.fill();

        if (isPalm) {
            ctx.fillStyle = '#fcff00';
            for (let x = Math.floor(a / 16) * 16; x < b; x += 16) {
                if (x < s.x0 || x + 8 > s.x1) continue;
                const y = s.f(x + 4);
                ctx.beginPath();
                ctx.moveTo(x + 2, y + 11); ctx.lineTo(x + 8, y + 11); ctx.lineTo(x + 5, y + 16);
                ctx.closePath(); ctx.fill();
            }
        }

        ctx.beginPath(); this.traceField(ctx, s);
        ctx.strokeStyle = isPalm ? '#58fc40' : '#7dff6a';
        ctx.lineWidth = 2.5; ctx.stroke();
    }

    drawWaterfallsBack(ctx) {
        const t = performance.now() * 0.08;
        for (const wf of this.terrain.waterfalls) {
            if (wf.x + wf.w < this.view.x0 || wf.x > this.view.x1) continue;
            const grad = ctx.createLinearGradient(wf.x, 0, wf.x + wf.w, 0);
            grad.addColorStop(0, 'rgba(120, 72, 240, 0.72)');
            grad.addColorStop(0.5, 'rgba(184, 136, 255, 0.82)');
            grad.addColorStop(1, 'rgba(120, 72, 240, 0.72)');
            ctx.fillStyle = grad;
            ctx.fillRect(wf.x, wf.y0, wf.w, wf.y1 - wf.y0);

            // Animated vertical foam bands
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            for (let x = wf.x + 8; x < wf.x + wf.w - 6; x += 16) {
                for (let y = wf.y0 + ((t + x * 0.7) % 36); y < wf.y1 - 12; y += 36) {
                    ctx.fillRect(x, y, 4, 18);
                }
            }
        }
    }

    drawWaterSurface(ctx) {
        const t = performance.now() * 0.004;
        for (const wz of this.terrain.waterZones) {
            if (wz.x1 < this.view.x0 || wz.x0 > this.view.x1) continue;
            ctx.fillStyle = 'rgba(120, 160, 255, 0.45)';
            ctx.fillRect(wz.x0, wz.y - 6, wz.x1 - wz.x0, 14);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            for (let x = wz.x0; x < wz.x1 - 16; x += 24) {
                const wave = Math.sin(t + x * 0.05) * 2;
                ctx.fillRect(x, wz.y - 6 + wave, 14, 2);
            }
        }
        // Render active water splashes using exact frames from `assets/palmtree_objects.png`!
        for (const sp of this.terrain.splashes) {
            const arr = sp.type === 'burst' ? PALMTREE_SPRITES.splashBurst : PALMTREE_SPRITES.splashPlume;
            const rect = arr[Math.min(sp.frame, arr.length - 1)];
            if (rect) {
                this.drawSprite(ctx, rect, sp.x - rect.w / 2, sp.y - rect.h);
            }
        }
    }

    drawTunnelsBack(ctx) {
        const list = this.terrain.tunnels && this.terrain.tunnels.length ? this.terrain.tunnels : (this.terrain.tunnel ? [this.terrain.tunnel] : []);
        for (const t of list) {
            if (t.x1 < this.view.x0 || t.x0 > this.view.x1) continue;
            const c = t.ceiling, f = t.floor || this.terrain.mainFloor;
            ctx.beginPath();
            const r = this.traceField(ctx, c);
            if (!r) continue;
            for (let x = r[1]; x > r[0]; x -= 4) ctx.lineTo(x, f.f(x));
            ctx.lineTo(r[0], f.f(r[0])); ctx.closePath();
            ctx.fillStyle = '#241004'; ctx.fill();
        }
    }

    drawTunnelsRock(ctx) {
        const isPalm = this.terrain.stage === 'palmtree';
        const list = this.terrain.tunnels && this.terrain.tunnels.length ? this.terrain.tunnels : (this.terrain.tunnel ? [this.terrain.tunnel] : []);
        for (const t of list) {
            if (t.x1 < this.view.x0 || t.x0 > this.view.x1) continue;
            const c = t.ceiling;
            ctx.beginPath();
            const r = this.traceField(ctx, c);
            if (!r) continue;
            ctx.lineTo(r[1], t.roofY); ctx.lineTo(r[0], t.roofY); ctx.closePath();
            ctx.fillStyle = isPalm ? this.patterns.palmtreeRock : this.patterns.rock;
            ctx.fill();
            ctx.beginPath(); this.traceField(ctx, c);
            ctx.strokeStyle = '#2a1405'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = isPalm ? '#00b400' : '#25b52a';
            ctx.fillRect(t.x0, t.roofY, t.x1 - t.x0, 11);
            ctx.fillStyle = '#7dff6a'; ctx.fillRect(t.x0, t.roofY, t.x1 - t.x0, 2);
        }
    }

    drawLoops(ctx) {
        const isPalm = this.terrain.stage === 'palmtree';
        const loops = this.terrain.loops && this.terrain.loops.length ? this.terrain.loops : [this.terrain.loop];
        for (const L of loops) {
            if (!L || L.cx + L.r + 40 < this.view.x0 || L.cx - L.r - 40 > this.view.x1) continue;
            ctx.beginPath(); ctx.arc(L.cx, L.cy, L.r + 28, 0, TAU); ctx.arc(L.cx, L.cy, L.r, 0, TAU, true);
            ctx.fillStyle = isPalm ? this.patterns.palmtreeLoop : this.patterns.loopChecker;
            ctx.fill();
            ctx.beginPath(); ctx.arc(L.cx, L.cy, L.r + 9, 0, TAU); ctx.arc(L.cx, L.cy, L.r, 0, TAU, true);
            ctx.fillStyle = isPalm ? '#00b400' : '#25b52a';
            ctx.fill();
            ctx.beginPath(); ctx.arc(L.cx, L.cy, L.r + 1, 0, TAU);
            ctx.strokeStyle = '#7dff6a'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(L.cx, L.cy, L.r + 28, 0, TAU);
            ctx.strokeStyle = '#5b2f10'; ctx.lineWidth = 2; ctx.stroke();
        }
    }

    drawSceneryProps(ctx) {
        // 1. Iconic Sonic CD Palmtree Panic Palm Trees (segmented gold trunk + green & magenta fronds)
        for (const pt of this.terrain.palmTrees) {
            if (pt.x < this.view.x0 - 90 || pt.x > this.view.x1 + 90) continue;
            this.drawSonicCDPalm(ctx, pt.x, pt.y, pt.scale || 1);
        }
        // 2. Good Future Plants from the sprite sheet (`plantTall` & `plantShort`)
        for (const pl of this.terrain.plants) {
            if (pl.x < this.view.x0 - 40 || pl.x > this.view.x1 + 40) continue;
            const rect = pl.tall ? PALMTREE_SPRITES.plantTall : PALMTREE_SPRITES.plantShort;
            if (!this.drawSprite(ctx, rect, pl.x - rect.w / 2, pl.y - rect.h)) {
                this.flower(ctx, pl.x, pl.y, '#ffe028');
            }
        }
    }

    drawSonicCDPalm(ctx, x, y, scale = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        // Segmented golden-brown trunk
        for (let i = 0; i < 7; i++) {
            const ty = -i * 13 - 6;
            const ox = Math.sin(i * 0.35) * 4;
            ctx.fillStyle = i % 2 === 0 ? '#dc7800' : '#a84800';
            ctx.beginPath();
            ctx.moveTo(ox - 7, ty + 6); ctx.lineTo(ox + 7, ty + 6);
            ctx.lineTo(ox + 5, ty - 6); ctx.lineTo(ox - 5, ty - 6);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fca800';
            ctx.fillRect(ox - 3, ty - 5, 4, 10);
        }
        const topX = Math.sin(2.1) * 4, topY = -96;
        // Magenta/pink Sonic CD upper crown accent fronds
        ctx.fillStyle = '#fc48a8';
        for (const a of [-0.9, -0.35, 0.35, 0.9]) {
            ctx.beginPath();
            ctx.ellipse(topX + Math.sin(a) * 22, topY - 4 + Math.abs(a) * 6, 22, 5.5, a * 0.7, 0, TAU);
            ctx.fill();
        }
        // Bright green lower palm fronds
        ctx.fillStyle = '#00c800';
        for (const a of [-1.1, -0.6, 0, 0.6, 1.1]) {
            ctx.beginPath();
            ctx.ellipse(topX + Math.sin(a) * 26, topY + 2 + Math.abs(a) * 8, 26, 6.5, a * 0.8, 0, TAU);
            ctx.fill();
        }
        // Coconuts / Gold center
        ctx.fillStyle = '#fca800';
        ctx.beginPath(); ctx.arc(topX - 4, topY + 4, 4, 0, TAU); ctx.arc(topX + 4, topY + 4, 4, 0, TAU); ctx.fill();
        ctx.restore();
    }

    /* ======================================================================
       RENDER ALL PALMTREE PANIC GOOD FUTURE OBJECTS FROM THE SPRITE SHEET
       ====================================================================== */
    drawPalmtreeObjects(ctx) {
        const T = this.terrain;
        const S = PALMTREE_SPRITES;

        // 1. Floating & Moving Platforms (platformSmall 32x32, platformLarge 64x32)
        for (const p of T.platforms) {
            if (p.x + p.w < this.view.x0 || p.x - p.w > this.view.x1) continue;
            const rect = p.large ? S.platformLarge : S.platformSmall;
            if (!this.drawSprite(ctx, rect, p.x - p.w / 2, p.y - 4, p.w, p.h)) {
                ctx.fillStyle = '#00b400'; ctx.fillRect(p.x - p.w / 2, p.y, p.w, 12);
            }
        }

        // 2. Swinging Pendulum Platforms (swingPivot, swingChain x4, swingLedge)
        for (const sw of T.swingPlatforms) {
            if (sw.pivotX + 100 < this.view.x0 || sw.pivotX - 100 > this.view.x1) continue;
            this.drawSprite(ctx, S.swingPivot, sw.pivotX - 8, sw.pivotY - 8);
            for (let i = 1; i <= 4; i++) {
                const f = i / 5;
                const cx = sw.pivotX + (sw.x - sw.pivotX) * f;
                const cy = sw.pivotY + (sw.y - sw.pivotY) * f;
                this.drawSprite(ctx, S.swingChain, cx - 8, cy - 8);
            }
            this.drawSprite(ctx, S.swingLedge, sw.x - 24, sw.y - 8);
        }

        // 3. Bounce Poles (poleStraight, poleBentDown, poleBentUp)
        for (const bp of T.bouncePoles) {
            if (bp.x + 40 < this.view.x0 || bp.x - 40 > this.view.x1) continue;
            const rect = bp.state === 'down' ? S.poleBentDown : bp.state === 'up' ? S.poleBentUp : S.poleStraight;
            this.drawSprite(ctx, rect, bp.x - 16, bp.y - 8, rect.w, rect.h, bp.dir < 0);
        }

        // 4. Spinners (alternating spinnerSilver & spinnerDark as they spin!)
        for (const sp of T.spinners) {
            if (sp.x + 30 < this.view.x0 || sp.x - 30 > this.view.x1) continue;
            const fast = sp.cooldown > 0 ? 2 : 6;
            const useDark = (Math.floor(sp.spinTimer / fast) + (sp.variant === 'dark' ? 1 : 0)) % 2 === 1;
            const rect = useDark ? S.spinnerDark : S.spinnerSilver;
            this.drawSprite(ctx, rect, sp.x - 16, sp.y - 8);
        }

        // 5. Houdini Steps (houdiniTrigger + 4 sparkling step frames)
        for (const hg of T.houdiniGroups) {
            if (hg.triggerX + 200 < this.view.x0 || hg.triggerX - 60 > this.view.x1) continue;
            this.drawSprite(ctx, S.houdiniTrigger, hg.triggerX - 12, hg.triggerY - 12);
            for (const st of hg.steps) {
                const frameIdx = Math.floor(st.animTimer) % S.houdiniSteps.length;
                this.drawSprite(ctx, S.houdiniSteps[frameIdx], st.x - 12, st.y - 12);
            }
        }

        // 6. Breakable Walls (3 columns of wallCols 16x48)
        for (const w of T.breakableWalls) {
            if (w.broken || w.x + 40 < this.view.x0 || w.x - 40 > this.view.x1) continue;
            for (let c = 0; c < 3; c++) {
                this.drawSprite(ctx, S.wallCols[c], w.x - 24 + c * 16, w.y - 48);
            }
        }

        // 7. Breakable Floors (breakFloorThin 128x40 & breakFloorThick 128x56)
        for (const bf of T.breakableFloors) {
            if (bf.broken || bf.x + bf.w < this.view.x0 || bf.x > this.view.x1) continue;
            const rect = bf.kind === 'thick' ? S.breakFloorThick : S.breakFloorThin;
            const shakeX = bf.stepping ? (Math.random() - 0.5) * 3 : 0;
            const shakeY = bf.stepping ? (Math.random() - 0.5) * 2 : 0;
            this.drawSprite(ctx, rect, bf.x + shakeX, bf.y - 4 + shakeY, bf.w, bf.h);
        }

        // 8. Trap Doors (trapDoorFlat when closed, trapDoorDown when open)
        for (const td of T.trapDoors) {
            if (td.x + td.w < this.view.x0 || td.x - 20 > this.view.x1) continue;
            if (td.isOpen) {
                this.drawSprite(ctx, S.trapDoorUp, td.x, td.y);
            } else {
                if (!td.warn || Math.floor(T.clock / 3) % 2 === 0) {
                    this.drawSprite(ctx, S.trapDoorFlat, td.x, td.y - 4);
                }
            }
        }

        // 9. Rocks (rock 40x32)
        for (const rk of T.rocks) {
            if (rk.broken || rk.x + 30 < this.view.x0 || rk.x - 30 > this.view.x1) continue;
            this.drawSprite(ctx, S.rock, rk.x - 20, rk.y - 32);
        }

        // 10. Speed Boosters
        for (const sb of T.speedBoosters) {
            if (sb.x + 30 < this.view.x0 || sb.x - 30 > this.view.x1) continue;
            ctx.save();
            ctx.translate(sb.x, sb.y);
            ctx.fillStyle = '#222'; ctx.fillRect(-16, -6, 32, 6);
            ctx.fillStyle = (Math.floor(T.clock / 4) % 2 === 0) ? '#ff2a2a' : '#ffe000';
            for (let i = -10; i <= 6; i += 8) {
                ctx.beginPath(); ctx.moveTo(i, -6); ctx.lineTo(i + 6, -3); ctx.lineTo(i, 0); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        // 11. Sonic CD Time Posts ('FUTURE' / 'PAST') & Goal Signpost
        for (const tp of T.timePosts) {
            if (tp.x + 30 < this.view.x0 || tp.x - 30 > this.view.x1) continue;
            this.drawTimePost(ctx, tp);
        }
        if (T.goalPost && T.goalPost.x + 60 >= this.view.x0 && T.goalPost.x - 60 <= this.view.x1) {
            this.drawGoalPost(ctx, T.goalPost);
        }

        // 12. Rings & Scattered Rings
        for (const r of T.rings) {
            if (r.collected || r.x < this.view.x0 || r.x > this.view.x1) continue;
            this.drawRing(ctx, r.x, r.y, T.clock);
        }
        for (const sr of T.scatteredRings) {
            if (sr.life < 45 && Math.floor(sr.life / 3) % 2 === 0) continue;
            this.drawRing(ctx, sr.x, sr.y, T.clock * 1.6);
        }

        // 13. Badniks (CrabBots & BuzzBots)
        for (const en of T.enemies) {
            if (!en.alive || en.x + 40 < this.view.x0 || en.x - 40 > this.view.x1) continue;
            if (en.kind === 'crab') this.drawCrabBot(ctx, en);
            else this.drawBuzzBot(ctx, en);
        }

        // 14. Shattered Wall Shards, Collapsing Floor Tiles & Score Popups
        for (const d of T.debris) {
            if (d.delay && d.delay > 0) {
                // Draw shaking tile still in place before its drop delay expires
                if (d.kind === 'floorTile') {
                    const rect = S.breakFloorTiles[Math.min(d.tileRow, S.breakFloorTiles.length - 1)];
                    this.drawSprite(ctx, rect, d.x - 8, d.y - 8);
                }
                continue;
            }
            if (d.kind === 'wallShard') {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rot);
                const rect = S.wallShards[d.shardIdx];
                this.drawSprite(ctx, rect, -8, -8);
                ctx.restore();
            } else if (d.kind === 'floorTile') {
                const rect = S.breakFloorTiles[Math.min(d.tileRow, S.breakFloorTiles.length - 1)];
                this.drawSprite(ctx, rect, d.x - 8, d.y - 8);
            } else if (d.kind === 'rockChunk') {
                ctx.fillStyle = '#9aa4b0';
                ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, TAU); ctx.fill();
            } else if (d.kind === 'sparkle') {
                ctx.fillStyle = '#fff59d';
                ctx.beginPath(); ctx.arc(d.x, d.y, 3.5, 0, TAU); ctx.fill();
            }
        }

        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        for (const pp of T.popups) {
            ctx.fillStyle = '#000'; ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
            ctx.fillStyle = '#ffeb3b'; ctx.fillText(pp.text, pp.x, pp.y);
        }
        ctx.textAlign = 'left';
    }

    drawRing(ctx, x, y, clock) {
        const w = Math.max(2.5, Math.abs(Math.cos(clock * 0.1)) * 7);
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(x, y, w, 7, 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#fff9c4'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(x - 0.5, y - 0.5, Math.max(1.5, w - 1), 5.5, 0, 0, TAU); ctx.stroke();
    }

    drawCrabBot(ctx, en) {
        const x = en.x, y = en.y - 12;
        const leg = Math.sin(this.terrain.clock * 0.3) * 3;
        ctx.fillStyle = '#ff9800';
        ctx.fillRect(x - 12, y + 6, 4, 6 + leg); ctx.fillRect(x + 8, y + 6, 4, 6 - leg);
        ctx.fillStyle = '#e53935';
        ctx.beginPath(); ctx.ellipse(x, y, 14, 10, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(x - 5, y - 4, 3.5, 0, TAU); ctx.arc(x + 5, y - 4, 3.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(x - 5 + Math.sign(en.vx), y - 4, 1.5, 0, TAU); ctx.arc(x + 5 + Math.sign(en.vx), y - 4, 1.5, 0, TAU); ctx.fill();
    }

    drawBuzzBot(ctx, en) {
        const x = en.x, y = en.y;
        ctx.fillStyle = 'rgba(200,240,255,0.75)';
        const wingY = Math.sin(this.terrain.clock * 0.8) * 5;
        ctx.beginPath(); ctx.ellipse(x - 4, y - 9 + wingY, 10, 4, -0.3, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 4, y - 9 - wingY, 10, 4, 0.3, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fdd835';
        ctx.beginPath(); ctx.ellipse(x, y, 13, 8, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1e88e5';
        ctx.beginPath(); ctx.ellipse(x - 7, y - 1, 6, 5, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff1744';
        ctx.beginPath(); ctx.arc(x - 9, y - 2, 2, 0, TAU); ctx.fill();
    }

    drawTimePost(ctx, tp) {
        ctx.save();
        ctx.translate(tp.x, tp.y);
        ctx.fillStyle = '#b0bec5'; ctx.fillRect(-2, -38, 4, 38);
        const scaleX = tp.spin > 0 ? Math.cos(tp.spin * 0.45) : 1;
        ctx.scale(scaleX, 1);
        const isFut = tp.kind === 'FUTURE';
        ctx.fillStyle = isFut ? '#00e5ff' : '#ff6d00';
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.fillRect(-18, -52, 36, 16);
        ctx.strokeRect(-18, -52, 36, 16);
        ctx.fillStyle = '#000'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(tp.kind, 0, -41);
        ctx.restore();
    }

    drawGoalPost(ctx, gp) {
        ctx.save();
        ctx.translate(gp.x, gp.y);
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-3, -58, 6, 58);
        const sx = gp.spinning ? Math.cos(gp.angle) : 1;
        ctx.scale(sx, 1);
        ctx.fillStyle = gp.cleared ? '#1e88e5' : '#d32f2f';
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, -68, 24, 18, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(gp.cleared ? 'SONIC' : 'EGGMAN', 0, -65);
        ctx.restore();
    }

    /* ---------------- Legacy Green Hill Test Stage helpers ---------------- */
    drawPit(ctx) {
        const g = this.terrain.gap;
        if (!g || g.x1 < this.view.x0 || g.x0 > this.view.x1) return;
        const y = this.terrain.deathY - 80;
        ctx.fillStyle = '#0d3f86'; ctx.fillRect(g.x0, y, g.x1 - g.x0, this.view.y1 - y + 60);
    }
    drawLegacyProps(ctx) {
        const f = this.terrain.mainFloor;
        const palms = [340, 760, 1200, 1990, 2790, 3250, 4250, 5200];
        for (const x of palms) if (x > this.view.x0 - 80 && x < this.view.x1 + 80) this.drawSonicCDPalm(ctx, x, f.f(x), 1);
    }
    flower(ctx, x, y, color) {
        ctx.strokeStyle = '#1f7f22'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - 16); ctx.stroke();
        const sway = Math.sin(performance.now() * 0.004 + x) * 1.5;
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + sway, y - 19, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + sway, y - 19, 2.4, 0, TAU); ctx.fill();
    }
    drawSigns(ctx) {
        ctx.font = 'bold 11px Courier New';
        for (const s of this.terrain.sections) {
            if (s.x < this.view.x0 - 200 || s.x > this.view.x1 + 50) continue;
            const surf = this.terrain.getSurfaceAt(s.x + 24, this.terrain.probeY, 0);
            if (!surf) continue;
            const x = s.x + 24, y = surf.y;
            const w = ctx.measureText(s.name).width + 14;
            ctx.fillStyle = '#6b4320'; ctx.fillRect(x - 2, y - 46, 4, 46);
            ctx.fillStyle = 'rgba(15,25,50,0.85)'; ctx.fillRect(x - w / 2, y - 66, w, 20);
            ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2 + 0.5, y - 65.5, w - 1, 19);
            ctx.fillStyle = '#ffd34d'; ctx.textAlign = 'center'; ctx.fillText(s.name, x, y - 52);
            ctx.textAlign = 'left';
        }
    }

    drawLoopDebug(ctx) {
        const loops = this.terrain.loops && this.terrain.loops.length ? this.terrain.loops : [{ ...this.terrain.loop, arc0: this.terrain.loopArc0, arc1: this.terrain.loopArc1, gates: this.terrain.gates }];
        const layer = this.player.layer;
        for (const L of loops) {
            if (!L || L.cx + L.r + 200 < this.view.x0 || L.cx - L.r - 200 > this.view.x1) continue;
            const arc = (s, color, active) => {
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = active ? 3 : 2; ctx.globalAlpha = active ? 1 : 0.35;
                if (!active) ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(L.cx, L.cy, L.r - 2, Math.PI / 2 - s.fromDeg * Math.PI / 180, Math.PI / 2 - s.toDeg * Math.PI / 180, true);
                ctx.stroke(); ctx.restore();
            };
            arc(L.arc0, '#00e5ff', layer === 0);
            arc(L.arc1, '#ff3dd0', layer === 1);
            ctx.save();
            ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.font = '10px Courier New';
            const G = L.gates;
            const gate = (x, y0, y1, color, label) => {
                ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
                ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(label, x, y0 - 6);
            };
            gate(G.entryX, L.cy - 60, L.cy + L.r, '#00e5ff', 'ENTRY → L0');
            gate(G.exitX, L.cy - 60, L.cy + L.r, '#ff3dd0', 'EXIT → L1');
            gate(G.apexX, L.cy - L.r - 4, L.cy - L.r + 44, '#ffe14d', 'APEX');
            ctx.restore();
            ctx.textAlign = 'left';
        }
    }

    drawParticles(ctx) {
        for (const q of this.particles) {
            const a = Math.max(0, q.life / q.max);
            ctx.fillStyle = `rgba(245,245,255,${a.toFixed(2)})`;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill();
        }
    }

    /* ---------------- player sprite ---------------- */
    drawPlayer(ctx) {
        const p = this.player;
        if (p.invulnTimer > 0 && Math.floor(p.invulnTimer / 3) % 2 === 1) return;
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.curled) this.drawBall(ctx, p);
        else {
            ctx.rotate(-p.visualAngle);
            ctx.scale(p.facing, 1);
            this.drawBody(ctx, p);
        }
        ctx.restore();
    }

    drawBall(ctx, p) {
        const R = HITBOX.ROLL.height;
        if (p.state === STATE.SPINDASH) {
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(-p.facing * i * 4, 0, R - i, 0, TAU); ctx.fill(); }
        }
        ctx.rotate(p.ballSpin);
        ctx.fillStyle = BLUE_D; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
        ctx.fillStyle = BLUE;
        for (let i = 0; i < 5; i++) {
            const a = i * TAU / 5;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - 0.5) * 7, Math.sin(a - 0.5) * 7);
            ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
            ctx.lineTo(Math.cos(a + 0.5) * 7, Math.sin(a + 0.5) * 7);
            ctx.fill();
        }
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = PEACH; ctx.beginPath(); ctx.ellipse(3, 3, 5, 3.5, 0.6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-3, -4, 3, 2, -0.6, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, R - 1, -0.3, 0.9); ctx.stroke();
    }

    drawBody(ctx, p) {
        const speed = Math.abs(p.grounded ? p.gsp : p.xsp);
        const crouch = p.crouching ? 6 : 0;
        ctx.translate(0, crouch);
        const lean = p.skidding ? -0.25 : Math.min(speed / PHYS.TOP, 1.2) * 0.12;
        ctx.rotate(lean);

        if (speed >= PHYS.TOP && p.grounded) {
            const r = p.runPhase * 2.2;
            ctx.strokeStyle = RED; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.ellipse(1, 13, 9, 5, r, 0, TAU); ctx.stroke();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.ellipse(1, 13, 9, 5, r, 0, TAU); ctx.stroke();
        } else {
            const moving = speed > 0.05 || !p.grounded;
            const sw = moving ? Math.sin(p.runPhase * 1.6 + (p.grounded ? 0 : performance.now() * 0.02)) * 0.7 : 0;
            for (const [x0, s] of [[-2, sw], [3, -sw]]) {
                ctx.save(); ctx.translate(x0, 8); ctx.rotate(s);
                ctx.fillStyle = BLUE; ctx.fillRect(-1.6, 0, 3.2, 7 - crouch * 0.6);
                ctx.fillStyle = RED; ctx.beginPath(); ctx.ellipse(2, 9.2 - crough(crouch), 5.2, 2.6, 0, 0, TAU); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 7.2 - crough(crouch), 2, 3.6);
                ctx.restore();
            }
        }
        ctx.fillStyle = BLUE;
        ctx.beginPath();
        ctx.moveTo(-3, -16); ctx.lineTo(-18, -13); ctx.lineTo(-9, -8); ctx.lineTo(-20, -3);
        ctx.lineTo(-9, 0); ctx.lineTo(-15, 7); ctx.lineTo(-3, 4); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 3, 6.5, 7, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = PEACH; ctx.beginPath(); ctx.ellipse(2, 4, 4, 5, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(1, -8, 9, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-4, -14); ctx.lineTo(-1, -21); ctx.lineTo(3, -15); ctx.fill();
        ctx.fillStyle = PEACH; ctx.beginPath(); ctx.ellipse(6.5, -5, 5, 3.6, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(11.3, -6.4, 1.6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(4.5, -10.5, 3.4, 4.4, 0.1, 0, TAU); ctx.fill();
        ctx.fillStyle = '#0a5a12'; ctx.fillRect(5.6, -11.5, 1.8, 3);
        ctx.fillStyle = PEACH; ctx.fillRect(0, 1, 6, 2);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, 2, 3, 0, TAU); ctx.fill();
    }

    /* ---------------- debug: hitbox + colour-coded sensors A–F ---------------- */
    drawSensors(ctx) {
        const p = this.player, r = p.radii;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-p.mode * Math.PI / 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
        ctx.strokeRect(-r.width, -r.height, r.width * 2, r.height * 2);
        ctx.restore();

        ctx.strokeStyle = '#ffee33'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.xsp * 4, p.y + p.ysp * 4); ctx.stroke();

        ctx.font = 'bold 9px Courier New';
        for (const k of ['A', 'B', 'C', 'D', 'E', 'F']) {
            const s = p.sensors[k];
            if (!s) continue;
            const col = SENSOR_COLORS[k];
            ctx.save();
            ctx.globalAlpha = s.active ? 1 : 0.3;
            if (!s.active) ctx.setLineDash([3, 3]);
            ctx.strokeStyle = col; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(s.ox, s.oy); ctx.lineTo(s.ox + s.dx * s.len, s.oy + s.dy * s.len); ctx.stroke();
            if (s.hit) {
                ctx.setLineDash([]);
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.hit.x, s.hit.y, 2.5, 0, TAU); ctx.fill();
                ctx.strokeStyle = col; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(s.hit.x, s.hit.y); ctx.lineTo(s.hit.x + s.hit.nx * 8, s.hit.y + s.hit.ny * 8); ctx.stroke();
            }
            ctx.fillStyle = col;
            ctx.fillText(k, s.ox + s.dx * s.len + 2, s.oy + s.dy * s.len + 3);
            ctx.restore();
        }
        ctx.fillStyle = '#ff2266'; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }

    panel(ctx, x, y, w, h) {
        ctx.fillStyle = 'rgba(5,12,24,0.86)'; ctx.strokeStyle = 'rgba(64,160,255,0.5)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
        ctx.fill(); ctx.stroke();
    }

    /* ---------------- Authentic Sonic CD HUD + Zone Map Radar ---------------- */
    drawSonicCDHUD(ctx) {
        const p = this.player;
        const mins = Math.floor(this.stageTime / 60);
        const secs = Math.floor(this.stageTime % 60).toString().padStart(2, '0');
        const cs = Math.floor((this.stageTime * 100) % 100).toString().padStart(2, '0');

        this.panel(ctx, 12, 10, 210, 86);
        ctx.font = 'bold 14px Courier New';
        const row = (label, val, y, labelCol = '#ffeb3b') => {
            ctx.fillStyle = '#000'; ctx.fillText(label, 23, y + 1); ctx.fillText(val, 105, y + 1);
            ctx.fillStyle = labelCol; ctx.fillText(label, 22, y);
            ctx.fillStyle = '#fff'; ctx.fillText(val, 104, y);
        };
        row('SCORE', String(p.score || 0).padStart(6, '0'), 30);
        row('TIME', `${mins}'${secs}"${cs}`, 50);
        const ringFlash = (p.rings || 0) === 0 && Math.floor(performance.now() / 250) % 2 === 0;
        row('RINGS', String(p.rings || 0).padStart(3, '0'), 70, ringFlash ? '#ff5252' : '#ffeb3b');

        // Time Warp charge indicator
        const T = this.terrain;
        ctx.font = 'bold 10px Courier New';
        const eraTxt = `ERA: ${(ERA_LABELS[T.timeEra] || 'Good Future').toUpperCase()}`;
        ctx.fillStyle = '#64ffda'; ctx.fillText(eraTxt, 22, 88);
        if (T.timeWarpTarget) {
            const pct = Math.min(1, T.timeWarpCharge / 90);
            ctx.fillStyle = '#ff9800';
            ctx.fillText(`WARP → ${T.timeWarpTarget.toUpperCase()} (${Math.round(pct * 100)}%)`, 235, 28);
        }

        // Act Clear overlay banner
        if (T.goalPost && T.goalPost.cleared) {
            this.panel(ctx, this.W / 2 - 210, 130, 420, 110);
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Courier New';
            ctx.fillStyle = '#ffeb3b';
            ctx.fillText('SCAR GOT THROUGH', this.W / 2, 165);
            ctx.fillStyle = '#00e5ff';
            ctx.fillText('STAGE ACT 1', this.W / 2, 192);
            ctx.font = 'bold 13px Courier New';
            ctx.fillStyle = '#fff';
            ctx.fillText(`FINAL SCORE: ${p.score}   ·   PRESS R TO PLAY AGAIN`, this.W / 2, 222);
            ctx.textAlign = 'left';
        }
    }

    /** Live mini-map at bottom-left using the uploaded Sonic CD `palmtree_map.png`! */
    drawZoneMapRadar(ctx) {
        if (!this.mapImgLoaded) return;
        const mw = 260, mh = 26, mx = 12, my = this.H - 64;
        this.panel(ctx, mx - 2, my - 2, mw + 4, mh + 4);
        ctx.drawImage(this.mapImg, mx, my, mw, mh);
        const px = mx + clamp01(this.player.x / this.terrain.endX) * mw;
        const py = my + clamp01((this.player.y - 180) / 620) * mh;
        if (Math.floor(performance.now() / 180) % 2 === 0) {
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        }
    }

    drawHUD(ctx) {
        const p = this.player;
        const deg = toDeg(p.angle);
        this.panel(ctx, 12, 102, 292, 246);
        ctx.font = 'bold 12px Courier New'; ctx.fillStyle = '#ffd700';
        ctx.fillText('SONIC RETRO PHYSICS — DEBUG', 24, 121);
        ctx.font = '12px Courier New';
        const absG = Math.abs(p.gsp);
        const rows = [
            ['STATE', p.state + (p.curled ? ' (ball)' : ''), p.state === STATE.SPINDASH ? '#ff7a33' : p.state === STATE.ROLLING ? '#00e5ff' : '#fff'],
            ['GSP', p.gsp.toFixed(3), absG >= PHYS.TOP ? '#ffcc00' : absG >= PHYS.FALL_THRESHOLD ? '#5dff5d' : '#ff6b6b'],
            ['XSP / YSP', `${p.xsp.toFixed(2)} / ${p.ysp.toFixed(2)}`, '#fff'],
            ['ANGLE', deg.toFixed(1) + '°', '#5dff5d'],
            ['QUAD MODE', `${p.mode} (${MODE_NAMES[p.mode]})`, '#ffa53d'],
            ['LOOP LAYER', String(p.layer), p.layer === 0 ? '#00e5ff' : '#ff3dd0'],
            ['CTRL LOCK', p.controlLock > 0 ? `${Math.ceil(p.controlLock)} frames` : '0', p.controlLock > 0 ? '#ff4d4d' : '#5dff5d'],
            ['SPIN REV', `${p.spindashRev.toFixed(2)} / 8`, p.spindashRev > 0 ? '#ff7a33' : '#888'],
            ['AIR MOTION', p.grounded ? '—' : p.airMotion, '#bbb'],
        ];
        let y = 140;
        for (const [k, v, c] of rows) {
            ctx.fillStyle = '#9cdcfe'; ctx.fillText(k, 24, y);
            ctx.fillStyle = c; ctx.fillText(v, 136, y);
            y += 18;
        }
        let x = 24; y += 4;
        ctx.font = 'bold 11px Courier New';
        for (const k of ['A', 'B', 'C', 'D', 'E', 'F']) {
            ctx.fillStyle = SENSOR_COLORS[k]; ctx.fillRect(x, y - 9, 10, 10);
            ctx.fillText(k, x + 13, y); x += 40;
        }
        ctx.font = '10px Courier New'; ctx.fillStyle = '#8a9bb0';
        ctx.fillText(`FPS ${this.fps} · x ${p.x.toFixed(0)} y ${p.y.toFixed(0)}`, 24, y + 18);
    }

    drawControlsHint(ctx) {
        const txt = '←/→ run  ↓ roll  Space/Z jump  ↓+Jump spin dash  1–7 checkpoints  T time era  M zone  Tab debug  R reset';
        ctx.font = '11px Courier New';
        const w = ctx.measureText(txt).width + 20;
        this.panel(ctx, (this.W - w) / 2, this.H - 30, w, 22);
        ctx.fillStyle = '#cfe6ff'; ctx.fillText(txt, (this.W - w) / 2 + 10, this.H - 15);
    }
}

function crough(c) { return c * 0.6; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

window.addEventListener('DOMContentLoaded', () => { window.sonicGame = new Game(); });
</script>
