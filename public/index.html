            const idx = Math.floor((64 - sp.spinTimer) * 0.5) % COMMON_SPRITES.checkpointSpin.length;
            const f = COMMON_SPRITES.checkpointSpin[idx];
            ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - f.ax, y - f.ay, f.w, f.h);
        } else {
            const base = COMMON_SPRITES.checkpointBase;
            ctx.drawImage(this.commonSheet, base.x, base.y, base.w, base.h, x - 8, y - 48, base.w, base.h);
            const orb = (sp.active && Math.floor(this.terrain.clock * 0.25) % 2 === 0)
                ? COMMON_SPRITES.checkpointRed
                : (sp.active ? COMMON_SPRITES.checkpointBlue : COMMON_SPRITES.checkpointBlue);
            ctx.drawImage(this.commonSheet, orb.x, orb.y, orb.w, orb.h, x - 8, y - 64, orb.w, orb.h);
        }
    }

    drawScarMiniIcon(ctx, x, y, w = 16, h = 16, withBg = false) {
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        if (withBg) {
            ctx.fillStyle = '#101830';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
        }
        if (this.scarSheetLoaded && this.scarSheet.complete && this.scarSheet.naturalWidth > 0) {
            ctx.drawImage(this.scarSheet, 10, 8, 28, 24, x, y, w, h);
        } else if (this.commonSheetLoaded) {
            const f = COMMON_SPRITES.monitorIcons.oneUp;
            ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x, y, w, h);
        }
        ctx.restore();
    }

    drawMonitorObj(ctx, m) {
        if (!this.commonSheetLoaded) return;
        const x = Math.round(m.x), y = Math.round(m.y);
        if (m.broken) {
            const br = COMMON_SPRITES.monitorBroken;
            ctx.drawImage(this.commonSheet, br.x, br.y, br.w, br.h, x - 16, y - 16, br.w, br.h);
            return;
        }
        const box = COMMON_SPRITES.monitorBox;
        ctx.drawImage(this.commonSheet, box.x, box.y, box.w, box.h, x - 15, y - 30, box.w, box.h);
        // Classic Sonic monitor screen: mostly shows the item icon, with brief static flicker
        const tick = Math.floor(this.terrain.clock * 0.25) % 8;
        if (tick === 0) {
            const scr = COMMON_SPRITES.monitorStatic[Math.floor(this.terrain.clock) % 3];
            ctx.drawImage(this.commonSheet, scr.x, scr.y, scr.w, scr.h, x - 8, y - 25, scr.w, scr.h);
        } else if (m.item === '1up' || m.item === 'oneUp') {
            this.drawScarMiniIcon(ctx, x - 8, y - 25, 16, 16, true);
        } else {
            const scr = COMMON_SPRITES.monitorIcons[m.item] || COMMON_SPRITES.monitorIcons.rings;
            ctx.drawImage(this.commonSheet, scr.x, scr.y, scr.w, scr.h, x - 8, y - 25, scr.w, scr.h);
        }
    }

    drawCapsuleObj(ctx, cap) {
        const x = Math.round(cap.x), y = Math.round(cap.y);
        const T = this.terrain;
        if (this.commonSheetLoaded) {
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            const blink = Math.floor(T.clock * 0.2) % 2;
            if (!cap.opened) {
                const f = COMMON_SPRITES.capsuleIdle[blink];
                ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - 32, y - f.h, f.w, f.h);
            } else {
                const f = COMMON_SPRITES.capsuleOpen[blink];
                ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - 32, y - f.h, f.w, f.h);
                // Hopping rescued critters & sparkles once capsule opens!
                const elapsed = Math.max(0, 85 - (cap.openTimer || 0));
                if (elapsed > 14) {
                    const colors = ['#4fc3f7', '#ffb74d', '#f06292', '#aed581'];
                    for (let i = 0; i < 4; i++) {
                        const dir = i % 2 === 0 ? -1 : 1;
                        const spd = 1.1 + (i % 3) * 0.45;
                        const tHop = Math.max(0, elapsed - 14 - i * 5);
                        const ax = x + dir * tHop * spd;
                        const ay = (y - 18) - Math.abs(Math.sin(tHop * 0.22)) * 22;
                        ctx.fillStyle = colors[i];
                        ctx.beginPath(); ctx.arc(ax, ay, 5, 0, TAU); ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(ax + dir * 1, ay - 2, 2, 2);
                    }
                }
            }
            ctx.restore();
            return;
        }
        ctx.fillStyle = '#546e7a';
        ctx.fillRect(x - 28, y - 60, 56, 60);
        ctx.fillStyle = cap.opened ? '#66bb6a' : '#ffd54f';
        ctx.fillRect(x - 14, y - (cap.opened ? 64 : 72), 28, 12);
    }

    drawBossObj(ctx, boss) {
        const def = this.terrain.levelDef;
        if (def && typeof def.drawBoss === 'function') {
            def.drawBoss(ctx, boss, this);
            return;
        }
        if (boss.defeated && boss.hidden) return;
        ctx.save();
        ctx.translate(Math.round(boss.x || 0), Math.round(boss.y || 0));
        if (boss.flashTimer && boss.flashTimer > 0 && Math.floor(boss.flashTimer) % 2 === 0) {
            ctx.globalAlpha = 0.45;
        }
        ctx.fillStyle = '#37474f';
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, 0, 32, 22, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    drawSpringObj(ctx, sp) {
        if (!this.commonSheetLoaded) return;
        const x = Math.round(sp.x), y = Math.round(sp.y);
        const isRed = sp.color === 'red';
        let f;
        if (sp.timer > 11) {
            f = isRed ? COMMON_SPRITES.springs.redFlat : COMMON_SPRITES.springs.yellowFlat;
        } else if (sp.timer > 0) {
            f = isRed ? COMMON_SPRITES.springs.redExt : COMMON_SPRITES.springs.yellowExt;
        } else {
            f = isRed ? COMMON_SPRITES.springs.redIdle : COMMON_SPRITES.springs.yellowIdle;
        }
        ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - Math.floor(f.w / 2), y - f.h, f.w, f.h);
    }

    drawSpikesObj(ctx, sc) {
        if (!this.commonSheetLoaded) return;
        const f = COMMON_SPRITES.spikesUp;
        ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, Math.round(sc.x - f.w / 2), Math.round(sc.y - f.h), f.w, f.h);
    }

    drawBigRingObj(ctx, br) {
        if (!this.commonSheetLoaded) return;
        const x = Math.round(br.x), y = Math.round(br.y);
        if (br.collected && br.flashTimer > 0) {
            const idx = Math.min(6, Math.floor((1 - br.flashTimer / 28) * 7));
            const f = COMMON_SPRITES.bigRingFlash[idx];
            ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - Math.floor(f.w / 2), y - Math.floor(f.h / 2), f.w, f.h);
            return;
        }
        const idx = Math.floor(this.terrain.clock * 0.14) % 4;
        const f = COMMON_SPRITES.bigRings[idx];
        ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - Math.floor(f.w / 2), y - Math.floor(f.h / 2), f.w, f.h);
    }

    drawEnemy(ctx, en, idx = 0) {
        const def = this.terrain.levelDef;
        if (def && typeof def.drawEnemy === 'function') {
            def.drawEnemy(ctx, en, {
                idx,
                clock: this.terrain.clock,
                player: this.player,
                sheet: this.customEnemySheetLoaded ? this.customEnemySheet : null,
                frames: def.enemyFrames || {},
            });
            return;
        }
        if (def && def.enemyFrames && this.customEnemySheetLoaded && en.frames && en.frames.length) {
            const rate = en.animRate || 0.2;
            const key = en.frames[Math.floor(this.terrain.clock * rate + idx) % en.frames.length];
            const frame = def.enemyFrames[key];
            if (frame) {
                const nativeFacesLeft = en.nativeFacesLeft !== false;
                const movingRight = en.kind === 'crab' ? (en.vx > 0) : (this.player.x > en.x);
                const flipX = nativeFacesLeft ? (movingRight ? -1 : 1) : (movingRight ? 1 : -1);
                ctx.save();
                ctx.translate(Math.round(en.x), Math.round(en.y));
                ctx.scale(flipX, 1);
                ctx.drawImage(this.customEnemySheet, frame.sx, frame.sy, frame.w, frame.h, -frame.ax, -frame.ay, frame.w, frame.h);
                ctx.restore();
                return;
            }
        }
        if (!this.enemySheetLoaded) {
            const x = en.x, y = en.kind === 'crab' ? en.y - 12 : en.y;
            ctx.fillStyle = en.kind === 'crab' ? '#e53935' : '#fdd835';
            ctx.beginPath(); ctx.ellipse(x, y, 14, 10, 0, 0, TAU); ctx.fill();
            return;
        }

        const clock = this.terrain.clock;
        const groundTypes = ['motobug', 'crab', 'spikes', 'caterkiller', 'burrobot'];
        const airTypes = ['buzz', 'batbrain', 'chopper'];
        const type = en.type || (en.kind === 'crab' ? groundTypes[idx % groundTypes.length] : airTypes[idx % airTypes.length]);

        let frameKey = 'crab_idle';
        let flipX = 1;

        if (type === 'motobug') {
            const seq = ['moto_1', 'moto_2', 'moto_3', 'moto_4'];
            frameKey = seq[Math.floor(clock * 0.25 + idx) % 4];
            // Native sprite faces left; flip when moving right (vx > 0)
            flipX = en.vx > 0 ? -1 : 1;
        } else if (type === 'crab') {
            const nearTurn = (en.minX !== undefined && (en.x - en.minX < 18 || en.maxX - en.x < 18));
            if (nearTurn) {
                frameKey = 'crab_attack';
            } else {
                const seq = ['crab_walk1', 'crab_idle', 'crab_walk2', 'crab_walk3'];
                frameKey = seq[Math.floor(clock * 0.16 + en.x * 0.05) % 4];
            }
            flipX = en.vx >= 0 ? 1 : -1;
        } else if (type === 'spikes') {
            const seq = ['spikes_1', 'spikes_2', 'spikes_3', 'spikes_2'];
            frameKey = seq[Math.floor(clock * 0.18 + idx) % 4];
            flipX = en.vx > 0 ? -1 : 1;
        } else if (type === 'caterkiller') {
            const seq = ['cater_1', 'cater_2', 'cater_3', 'cater_4'];
            frameKey = seq[Math.floor(clock * 0.2 + idx) % 4];
            flipX = en.vx > 0 ? -1 : 1;
        } else if (type === 'burrobot') {
            const seq = ['burro_1', 'burro_2', 'burro_3', 'burro_4'];
            frameKey = seq[Math.floor(clock * 0.22 + idx) % 4];
            flipX = en.vx > 0 ? -1 : 1;
        } else if (type === 'batbrain') {
            const seq = ['bat_1', 'bat_2', 'bat_3', 'bat_2'];
            frameKey = seq[Math.floor(clock * 0.28 + (en.phase || 0)) % 4];
            const facingLeft = this.player.x < en.x;
            flipX = facingLeft ? 1 : -1;
        } else if (type === 'chopper') {
            const seq = ['chopper_1', 'chopper_2'];
            frameKey = seq[Math.floor(clock * 0.24 + (en.phase || 0)) % 2];
            const facingLeft = this.player.x < en.x;
            flipX = facingLeft ? 1 : -1;
        } else {
            // Buzz Bomber ('buzz')
            const distToPlayer = Math.hypot(this.player.x - en.x, this.player.y - en.y);
            const isAiming = distToPlayer < 150 && this.player.y > en.y;
            if (isAiming) {
                frameKey = (Math.floor(clock * 0.18) % 2 === 0) ? 'buzz_aim' : 'buzz_fire';
            } else {
                const seq = ['buzz_fly1', 'buzz_fly2', 'buzz_fly3', 'buzz_fly4'];
                frameKey = seq[Math.floor(clock * 0.35 + (en.phase || 0)) % 4];
            }
            const facingLeft = this.player.x < en.x;
            flipX = facingLeft ? 1 : -1;
        }

        const frame = ENEMY_FRAMES[frameKey] || ENEMY_FRAMES.crab_idle;

        ctx.save();
        ctx.translate(Math.round(en.x), Math.round(en.y));
        ctx.scale(flipX, 1);
        ctx.drawImage(
            this.enemySheet,
            frame.sx, frame.sy, frame.w, frame.h,
            -frame.ax, -frame.ay, frame.w, frame.h
        );
        ctx.restore();
    }

    drawTimePost(ctx, tp) {
        ctx.save();
        ctx.translate(tp.x, tp.y);
        ctx.fillStyle = '#b0bec5'; ctx.fillRect(-2, -38, 4, 38);
        const scaleX = tp.spin > 0 ? Math.cos(tp.spin * 0.45) : 1;
        ctx.scale(scaleX, 1);
        const isFut = tp.kind === 'FUTURE';
        ctx.fillStyle = isFut ? '#00e5ff' : '#ff6d00';
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.fillRect(-18, -52, 36, 16);
        ctx.strokeRect(-18, -52, 36, 16);
        ctx.fillStyle = '#000'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(tp.kind, 0, -41);
        ctx.restore();
    }

    drawGoalPost(ctx, gp) {
        if (this.commonSheetLoaded) {
            const x = Math.round(gp.x), y = Math.round(gp.y);
            if (!gp.spinning && !gp.cleared) {
                const f = COMMON_SPRITES.goalRobotnik;
                ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - 24, y - 48, f.w, f.h);
            } else if (gp.cleared) {
                const stub = COMMON_SPRITES.goalPostStub;
                const top = COMMON_SPRITES.goalSonicTop;
                ctx.drawImage(this.commonSheet, stub.x, stub.y, stub.w, stub.h, x - 4, y - 16, stub.w, stub.h);
                ctx.drawImage(this.commonSheet, top.x, top.y, top.w, top.h, x - 24, y - 48, top.w, top.h);
            } else {
                // Spinning sequence: Robotnik -> Diag1 -> Edge -> Diag2 -> Sonic -> Diag1 -> Edge -> Diag2
                const step = Math.floor(gp.angle * 1.4) % 8;
                if (step === 0) {
                    const f = COMMON_SPRITES.goalRobotnik;
                    ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - 24, y - 48, f.w, f.h);
                } else if (step === 4) {
                    const stub = COMMON_SPRITES.goalPostStub;
                    const top = COMMON_SPRITES.goalSonicTop;
                    ctx.drawImage(this.commonSheet, stub.x, stub.y, stub.w, stub.h, x - 4, y - 16, stub.w, stub.h);
                    ctx.drawImage(this.commonSheet, top.x, top.y, top.w, top.h, x - 24, y - 48, top.w, top.h);
                } else {
                    const map = {
                        1: COMMON_SPRITES.goalDiag1,
                        2: COMMON_SPRITES.goalEdge,
                        3: COMMON_SPRITES.goalDiag2,
                        5: COMMON_SPRITES.goalDiag1,
                        6: COMMON_SPRITES.goalEdge,
                        7: COMMON_SPRITES.goalDiag2
                    };
                    const f = map[step];
                    ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, x - Math.floor(f.w / 2), y - 48, f.w, f.h);
                }
            }
            return;
        }
        ctx.save();
        ctx.translate(gp.x, gp.y);
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-3, -58, 6, 58);
        const sx = gp.spinning ? Math.cos(gp.angle) : 1;
        ctx.scale(sx, 1);
        ctx.fillStyle = gp.cleared ? '#1e88e5' : '#d32f2f';
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, -68, 24, 18, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    /* ---------------- Legacy Green Hill Test Stage helpers ---------------- */
    drawPit(ctx) {
        const g = this.terrain.gap;
        if (!g || g.x1 < this.view.x0 || g.x0 > this.view.x1) return;
        const y = this.terrain.deathY - 80;
        ctx.fillStyle = '#0d3f86'; ctx.fillRect(g.x0, y, g.x1 - g.x0, this.view.y1 - y + 60);
    }
    drawLegacyProps(ctx) {
        const f = this.terrain.mainFloor;
        const palms = [340, 760, 1200, 1990, 2790, 3250, 4250, 5200];
        for (const x of palms) if (x > this.view.x0 - 80 && x < this.view.x1 + 80) this.drawSonicCDPalm(ctx, x, f.f(x), 1);
    }
    flower(ctx, x, y, color) {
        ctx.strokeStyle = '#1f7f22'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - 16); ctx.stroke();
        const sway = Math.sin(performance.now() * 0.004 + x) * 1.5;
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + sway, y - 19, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + sway, y - 19, 2.4, 0, TAU); ctx.fill();
    }
    drawSigns(ctx) {
        ctx.font = 'bold 11px Courier New';
        for (const s of this.terrain.sections) {
            if (s.x < this.view.x0 - 200 || s.x > this.view.x1 + 50) continue;
            const surf = this.terrain.getSurfaceAt(s.x + 24, this.terrain.probeY, 0);
            if (!surf) continue;
            const x = s.x + 24, y = surf.y;
            const w = ctx.measureText(s.name).width + 14;
            ctx.fillStyle = '#6b4320'; ctx.fillRect(x - 2, y - 46, 4, 46);
            ctx.fillStyle = 'rgba(15,25,50,0.85)'; ctx.fillRect(x - w / 2, y - 66, w, 20);
            ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2 + 0.5, y - 65.5, w - 1, 19);
            ctx.fillStyle = '#ffd34d'; ctx.textAlign = 'center'; ctx.fillText(s.name, x, y - 52);
            ctx.textAlign = 'left';
        }
    }

    drawLoopDebug(ctx) {
        const loops = this.terrain.loops && this.terrain.loops.length ? this.terrain.loops : [{ ...this.terrain.loop, arc0: this.terrain.loopArc0, arc1: this.terrain.loopArc1, gates: this.terrain.gates }];
        const layer = this.player.layer;
        for (const L of loops) {
            if (!L || L.cx + L.r + 200 < this.view.x0 || L.cx - L.r - 200 > this.view.x1) continue;
            const arc = (s, color, active) => {
                ctx.save();
                ctx.strokeStyle = color; ctx.lineWidth = active ? 3 : 2; ctx.globalAlpha = active ? 1 : 0.35;
                if (!active) ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(L.cx, L.cy, L.r - 2, Math.PI / 2 - s.fromDeg * Math.PI / 180, Math.PI / 2 - s.toDeg * Math.PI / 180, true);
                ctx.stroke(); ctx.restore();
            };
            arc(L.arc0, '#00e5ff', layer === 0);
            arc(L.arc1, '#ff3dd0', layer === 1);
            ctx.save();
            ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.font = '10px Courier New';
            const G = L.gates;
            const gate = (x, y0, y1, color, label) => {
                ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
                ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(label, x, y0 - 6);
            };
            gate(G.entryX, L.cy - 60, L.cy + L.r, '#00e5ff', 'ENTRY → L0');
            gate(G.exitX, L.cy - 60, L.cy + L.r, '#ff3dd0', 'EXIT → L1');
            gate(G.apexX, L.cy - L.r - 4, L.cy - L.r + 44, '#ffe14d', 'APEX');
            ctx.restore();
            ctx.textAlign = 'left';
        }
    }

    drawParticles(ctx) {
        for (const q of this.particles) {
            const a = Math.max(0, q.life / q.max);
            ctx.fillStyle = `rgba(245,245,255,${a.toFixed(2)})`;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill();
        }
    }

    /* ---------------- Scar the Hedgerec sprite & animation machine ---------------- */
    drawPlayer(ctx) {
        const p = this.player;
        if (p.invulnTimer > 0 && Math.floor(p.invulnTimer / 3) % 2 === 1) return;
        ctx.save();
        ctx.translate(Math.round(p.x), Math.round(p.y));
        if (p.curled) this.drawBall(ctx, p);
        else {
            ctx.rotate(-p.visualAngle);
            ctx.scale(p.facing, 1);
            this.drawBody(ctx, p);
        }
        // Render Blue Shield or Invincibility Sparkles from the Common Objects sprite sheet!
        if (this.commonSheetLoaded) {
            const clock = Math.floor(this.terrain.clock);
            if (p.invincTimer && p.invincTimer > 0) {
                const f = COMMON_SPRITES.invinc[Math.floor(clock * 0.35) % COMMON_SPRITES.invinc.length];
                ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, -24, -24, f.w, f.h);
            } else if (p.shield && clock % 2 === 0) {
                // Classic Sonic 1 flickering shield effect (empty frame between each noted frame)
                const f = COMMON_SPRITES.shield[Math.floor(clock / 2) % COMMON_SPRITES.shield.length];
                ctx.drawImage(this.commonSheet, f.x, f.y, f.w, f.h, -Math.floor(f.w / 2), -Math.floor(f.h / 2), f.w, f.h);
            }
        }
        ctx.restore();
    }

    drawBall(ctx, p) {
        const R = HITBOX.ROLL.height;
        if (p.state === STATE.SPINDASH) {
            ctx.fillStyle = 'rgba(136, 128, 255, 0.38)';
            for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(-p.facing * i * 4, 0, R - i, 0, TAU); ctx.fill(); }
        }
        ctx.rotate(p.ballSpin);
        ctx.fillStyle = BLUE_D; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
        ctx.fillStyle = BLUE;
        for (let i = 0; i < 5; i++) {
            const a = i * TAU / 5;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - 0.5) * 7, Math.sin(a - 0.5) * 7);
            ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
            ctx.lineTo(Math.cos(a + 0.5) * 7, Math.sin(a + 0.5) * 7);
            ctx.fill();
        }
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        // Scar's crimson cape/glove & electric cyan shoe streaks while spinning
        ctx.strokeStyle = RED; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(0, 0, R - 2.5, 0.4, 2.1); ctx.stroke();
        ctx.strokeStyle = CYAN_SHOE; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, R - 2.5, 3.5, 5.1); ctx.stroke();
        ctx.fillStyle = PEACH; ctx.beginPath(); ctx.ellipse(3, 3, 4.5, 3, 0.6, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, R - 1, -0.3, 0.9); ctx.stroke();
    }

    /**
     * Resolves which Scar sprite frame (0=idle, 1=walk1, 2=walk2, 3=run1, 4=run2)
     * and transition cadence to use based on player state and ground/air speed.
     */
    selectScarFrame(p, speed) {
        if (!p.grounded) {
            this._scarAirPhase = (this._scarAirPhase || 0) + Math.max(0.12, speed * 0.08) * (this.dt60 || 1);
            if (speed >= 5.2) {
                return (Math.floor(this._scarAirPhase * 1.8) % 2 === 0) ? 3 : 4;
            }
            return (Math.floor(this._scarAirPhase) % 2 === 0) ? 2 : 1;
        }
        this._scarAirPhase = 0;

        // 1. Standing / Idle
        if (speed <= 0.06 && !p.skidding) {
            this._scarStepPhase = 0;
            return 0; // idle
        }

        // Advance continuous stride phase proportional to ground speed
        const dt = this.dt60 || 1;
        const rate = 0.09 + Math.min(speed, 10) * 0.055;
        this._scarStepPhase = (this._scarStepPhase || 0) + rate * dt;

        if (p.skidding) {
            return 1; // compact bracing pose during skid
        }

        // 2. Step-In / Slow Walk Transition (0.06 < speed < 0.95):
        // Smooth 4-beat cycle: idle -> walk1 (passing) -> walk2 (stride) -> walk1 (passing)
        if (speed < 0.95) {
            const seq = [0, 1, 2, 1];
            return seq[Math.floor(this._scarStepPhase * 1.35) % 4];
        }

        // 3. Classic Walk / Jog Cycle (0.95 <= speed < 4.2):
        // Alternates between walk1 (passing pose) and walk2 (full stride extension)
        if (speed < 4.2) {
            return (Math.floor(this._scarStepPhase * 1.65) % 2 === 0) ? 1 : 2;
        }

        // 4. Walk-to-Run Transition Blend (4.2 <= speed < 5.3):
        // Bridges full-extension stride (walk2) into the figure-8 peel-out run (run1/run2)
        if (speed < 5.3) {
            const bridge = speed < 4.75 ? [1, 2, 3, 2] : [2, 3, 4, 3];
            return bridge[Math.floor(this._scarStepPhase * 2.1) % 4];
        }

        // 5. Full-Speed Figure-8 Peel-Out Run (speed >= 5.3):
        // Rapidly alternates between run1 and run2
        return (Math.floor(this._scarStepPhase * 2.5) % 2 === 0) ? 3 : 4;
    }

    drawBody(ctx, p) {
        const speed = Math.abs(p.grounded ? p.gsp : p.xsp);
        const frameIdx = this.selectScarFrame(p, speed);
        const frame = SCAR_FRAMES[frameIdx] || SCAR_FRAMES[0];

        if (this.scarSheetLoaded && this.scarSheet.complete && this.scarSheet.naturalWidth > 0) {
            ctx.save();
            ctx.imageSmoothingEnabled = false;

            // Crouch feedback when holding Down while standing
            if (p.crouching) {
                ctx.translate(0, 3);
                ctx.scale(1.06, 0.86);
            } else if (frameIdx === 0 && p.grounded) {
                // Subtle 1px retro idle breathing bob
                const bob = Math.floor(performance.now() / 420) % 2;
                ctx.translate(0, bob);
            }

            // Slight skid lean-back or high-speed forward tilt
            if (p.skidding) {
                ctx.rotate(-0.18);
            }

            const footBottomY = HITBOX.STAND.height; // +19px from player center
            const dx = -frame.anchorX;
            const dy = footBottomY - frame.anchorY;  // aligns sprite foot y=47 to local y=+19

            // High-speed Scar afterimage echo when running at or above TOP speed
            if (speed >= PHYS.TOP) {
                ctx.save();
                ctx.globalAlpha = 0.28;
                const altFrame = SCAR_FRAMES[frameIdx === 3 ? 4 : 3];
                ctx.drawImage(this.scarSheet, altFrame.sx, 0, 48, 48, dx - 6, dy, 48, 48);
                ctx.restore();
            }

            ctx.drawImage(this.scarSheet, frame.sx, 0, 48, 48, dx, dy, 48, 48);
            ctx.restore();
            return;
        }
    }

    /* ---------------- debug: hitbox + colour-coded sensors A–F ---------------- */
    drawSensors(ctx) {
        const p = this.player, r = p.radii;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-p.mode * Math.PI / 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
        ctx.strokeRect(-r.width, -r.height, r.width * 2, r.height * 2);
        ctx.restore();

        ctx.strokeStyle = '#ffee33'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.xsp * 4, p.y + p.ysp * 4); ctx.stroke();

        ctx.font = 'bold 9px Courier New';
        for (const k of ['A', 'B', 'C', 'D', 'E', 'F']) {
            const s = p.sensors[k];
            if (!s) continue;
            const col = SENSOR_COLORS[k];
            ctx.save();
            ctx.globalAlpha = s.active ? 1 : 0.3;
            if (!s.active) ctx.setLineDash([3, 3]);
            ctx.strokeStyle = col; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(s.ox, s.oy); ctx.lineTo(s.ox + s.dx * s.len, s.oy + s.dy * s.len); ctx.stroke();
            if (s.hit) {
                ctx.setLineDash([]);
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.hit.x, s.hit.y, 2.5, 0, TAU); ctx.fill();
                ctx.strokeStyle = col; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(s.hit.x, s.hit.y); ctx.lineTo(s.hit.x + s.hit.nx * 8, s.hit.y + s.hit.ny * 8); ctx.stroke();
            }
            ctx.fillStyle = col;
            ctx.fillText(k, s.ox + s.dx * s.len + 2, s.oy + s.dy * s.len + 3);
            ctx.restore();
        }
        ctx.fillStyle = '#ff2266'; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }

    panel(ctx, x, y, w, h) {
        ctx.fillStyle = 'rgba(5,12,24,0.86)'; ctx.strokeStyle = 'rgba(64,160,255,0.5)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
        ctx.fill(); ctx.stroke();
    }

    /* ---------------- Authentic Sonic CD HUD + Zone Map Radar ---------------- */
    drawSonicCDHUD(ctx) {
        const p = this.player;
        const mins = Math.floor(this.stageTime / 60);
        const secs = Math.floor(this.stageTime % 60).toString().padStart(2, '0');
        const cs = Math.floor((this.stageTime * 100) % 100).toString().padStart(2, '0');

        this.panel(ctx, 12, 10, 210, 86);
        ctx.font = 'bold 14px Courier New';
        const row = (label, val, y, labelCol = '#ffeb3b') => {
            ctx.fillStyle = '#000'; ctx.fillText(label, 23, y + 1); ctx.fillText(val, 105, y + 1);
            ctx.fillStyle = labelCol; ctx.fillText(label, 22, y);
            ctx.fillStyle = '#fff'; ctx.fillText(val, 104, y);
        };
        row('SCORE', String(p.score || 0).padStart(6, '0'), 30);
        row('TIME', `${mins}'${secs}"${cs}`, 50);
        const ringFlash = (p.rings || 0) === 0 && Math.floor(performance.now() / 250) % 2 === 0;
        row('RINGS', String(p.rings || 0).padStart(3, '0'), 70, ringFlash ? '#ff5252' : '#ffeb3b');

        // Time Warp charge indicator
        const T = this.terrain;
        ctx.font = 'bold 10px Courier New';
        const eraTxt = `ERA: ${(ERA_LABELS[T.timeEra] || 'Good Future').toUpperCase()}`;
        ctx.fillStyle = '#64ffda'; ctx.fillText(eraTxt, 22, 88);
        if (T.timeWarpTarget) {
            const pct = Math.min(1, T.timeWarpCharge / 90);
            ctx.fillStyle = '#ff9800';
            ctx.fillText(`WARP → ${T.timeWarpTarget.toUpperCase()} (${Math.round(pct * 100)}%)`, 235, 28);
        }

        // Classic Lives Badge (SCAR × 03)
        this.panel(ctx, 12, 100, 134, 34);
        this.drawScarMiniIcon(ctx, 20, 107, 22, 20, true);
        ctx.font = 'bold 11px Courier New';
        ctx.fillStyle = '#000'; ctx.fillText('SCAR', 51, 114);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText('SCAR', 50, 113);
        const livesVal = `× ${String(Math.max(0, p.lives !== undefined ? p.lives : 3)).padStart(2, '0')}`;
        ctx.font = 'bold 14px Courier New';
        ctx.fillStyle = '#000'; ctx.fillText(livesVal, 51, 129);
        ctx.fillStyle = '#fff'; ctx.fillText(livesVal, 50, 128);
    }

    drawActClearOverlay(ctx) {
        const ac = this.actClear;
        if (!ac) return;
        const p = this.player;
        const cx = this.W / 2;
        const slideProg = ac.phase === 'intro' ? clamp01(1 - ac.timer / 42) : 1;
        const ease = 1 - Math.pow(1 - slideProg, 3);
        const offX = Math.round((1 - ease) * 520);

        this.panel(ctx, cx - 235 + offX, 118, 470, 198);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px Courier New';
        ctx.fillStyle = '#000'; ctx.fillText('SCAR GOT THROUGH', cx + 2 - offX, 154);
        ctx.fillStyle = '#ffeb3b'; ctx.fillText('SCAR GOT THROUGH', cx - offX, 152);

        const subTitle = (ac.meta.isBossAct || ac.meta.act === 3)
            ? `${ac.meta.zoneName} — ZONE ${ac.meta.zone} CLEAR!`
            : `${ac.meta.zoneName}   ACT ${ac.meta.act}`;
        ctx.font = 'bold 18px Courier New';
        ctx.fillStyle = '#000'; ctx.fillText(subTitle, cx + 2 + offX, 180);
        ctx.fillStyle = '#00e5ff'; ctx.fillText(subTitle, cx + offX, 178);

        const drawTallyRow = (label, val, y, badgeCol) => {
            const lx = cx - 175 + offX, rx = cx + 175 + offX;
            ctx.fillStyle = badgeCol;
            ctx.fillRect(lx - 6, y - 13, 14, 14);
            ctx.textAlign = 'left';
            ctx.font = 'bold 15px Courier New';
            ctx.fillStyle = '#000'; ctx.fillText(label, lx + 17, y + 1);
            ctx.fillStyle = '#ffeb3b'; ctx.fillText(label, lx + 16, y);
            ctx.textAlign = 'right';
            const sVal = String(val).padStart(6, '0');
            ctx.fillStyle = '#000'; ctx.fillText(sVal, rx + 1, y + 1);
            ctx.fillStyle = '#fff'; ctx.fillText(sVal, rx, y);
        };

        drawTallyRow('TIME BONUS', ac.timeBonus, 214, '#29b6f6');
        drawTallyRow('RING BONUS', ac.ringBonus, 240, '#ffd54f');
        drawTallyRow('TOTAL SCORE', p.score || 0, 268, '#ef5350');

        ctx.textAlign = 'center';
        ctx.font = 'bold 12px Courier New';
        ctx.fillStyle = '#b2ebf2';
        if (ac.phase === 'tally' || ac.phase === 'intro') {
            ctx.fillText('PRESS JUMP TO FAST-FORWARD TALLY', cx, 298);
        } else if (ac.nextStage) {
            ctx.fillText('ADVANCING TO NEXT ACT...', cx, 298);
        } else {
            ctx.fillText(`ZONE ${ac.meta.zone} COMPLETE!  ·  PRESS JUMP TO CONTINUE OR R TO REPLAY`, cx, 298);
        }
        ctx.restore();
    }

    drawGameOverOverlay(ctx) {
        const p = this.player;
        if (!p || !p.gameOver) return;
        const t = clamp01((this.gameOverTimer || 0) / 34);
        const ease = 1 - Math.pow(1 - t, 3);

        ctx.save();
        ctx.fillStyle = `rgba(4, 8, 18, ${(0.64 * ease).toFixed(3)})`;
        ctx.fillRect(0, 0, this.W, this.H);

        const isTimeOver = p.gameOverReason === 'TIME OVER';
        const cy = Math.round(this.H / 2 - 28);
        const scale = 3.5;

        if (this.commonSheetLoaded) {
            ctx.imageSmoothingEnabled = false;
            const leftRect = isTimeOver ? COMMON_SPRITES.timeWord : COMMON_SPRITES.gameWord;
            const rightRect = COMMON_SPRITES.overWord;
            const lw = Math.round(leftRect.w * scale), lh = Math.round(leftRect.h * scale);
            const rw = Math.round(rightRect.w * scale), rh = Math.round(rightRect.h * scale);
            const gap = 26;
            const totalW = lw + gap + rw;
            const targetLeftX = Math.round((this.W - totalW) / 2);
            const targetRightX = targetLeftX + lw + gap;

            const curLeftX = Math.round(-lw - 40 + (targetLeftX - (-lw - 40)) * ease);
            const curRightX = Math.round((this.W + 40) + (targetRightX - (this.W + 40)) * ease);

            ctx.drawImage(this.commonSheet, leftRect.x, leftRect.y, leftRect.w, leftRect.h, curLeftX, cy - Math.floor(lh / 2), lw, lh);
            ctx.drawImage(this.commonSheet, rightRect.x, rightRect.y, rightRect.w, rightRect.h, curRightX, cy - Math.floor(rh / 2), rw, rh);
        } else {
            ctx.textAlign = 'center';
            ctx.font = 'bold 48px Courier New';
            const word = isTimeOver ? 'TIME OVER' : 'GAME OVER';
            ctx.fillStyle = '#000'; ctx.fillText(word, this.W / 2 + 3, cy + 16);
            ctx.fillStyle = '#ff5252'; ctx.fillText(word, this.W / 2, cy + 13);
        }

        if ((this.gameOverTimer || 0) > 42 && Math.floor(performance.now() / 320) % 2 === 0) {
            ctx.textAlign = 'center';
            ctx.font = 'bold 15px Courier New';
            ctx.fillStyle = '#000';
            ctx.fillText('PRESS JUMP OR R TO CONTINUE', this.W / 2 + 2, cy + 66);
            ctx.fillStyle = '#ffeb3b';
            ctx.fillText('PRESS JUMP OR R TO CONTINUE', this.W / 2, cy + 64);
        }
        ctx.restore();
    }

    drawTitleCard(ctx) {
        const tc = this.titleCard;
        if (!tc) return;
        const elapsed = tc.max - tc.timer;
        let prog = 1;
        if (elapsed < 22) {
            const u = clamp01(elapsed / 22);
            prog = 1 - Math.pow(1 - u, 3);
        } else if (tc.timer < 26) {
            const u = clamp01(tc.timer / 26);
            prog = Math.pow(u, 3);
        }

        const offLeft = Math.round((1 - prog) * 480);
        const offRight = Math.round((1 - prog) * 640);
        const offTop = Math.round((1 - prog) * 320);

        ctx.save();
        // 1. Classic Sonic vertical crimson geometric ribbon on left
        const rx = 205 - offLeft;
        ctx.fillStyle = '#d50000';
        ctx.beginPath();
        ctx.moveTo(rx, -20 - offTop);
        ctx.lineTo(rx + 86, -20 - offTop);
        ctx.lineTo(rx + 60, 395 - offTop);
        ctx.lineTo(rx - 26, 395 - offTop);
        ctx.closePath();
        ctx.fill();

        // Gold & white accent stripes along the crimson pennant
        ctx.fillStyle = '#ffd600';
        ctx.beginPath();
        ctx.moveTo(rx + 74, -20 - offTop);
        ctx.lineTo(rx + 86, -20 - offTop);
        ctx.lineTo(rx + 60, 395 - offTop);
        ctx.lineTo(rx + 48, 395 - offTop);
        ctx.closePath();
        ctx.fill();

        // Mini Scar emblem on the ribbon
        this.drawScarMiniIcon(ctx, rx + 12, 128 - offTop, 36, 32, true);

        // 2. Royal-navy horizontal Zone Name bar sliding in from the right
        const bx = 225 + offRight, by = 178, bw = 535, bh = 104;
        ctx.fillStyle = 'rgba(8, 20, 52, 0.95)';
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx, by, bw, bh);
        ctx.fillStyle = '#ffd600';
        ctx.fillRect(bx, by + bh - 8, bw, 8);

        // Zone Title Text (3D 16-bit shadow)
        ctx.textAlign = 'left';
        const titleFont = tc.zoneName.length > 15 ? 'bold 28px Courier New' : 'bold 34px Courier New';
        ctx.font = titleFont;
        ctx.fillStyle = '#000';
        ctx.fillText(tc.zoneName, bx + 26, by + 46);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(tc.zoneName, bx + 23, by + 43);

        ctx.font = 'bold 22px Courier New';
        ctx.fillStyle = '#000';
        ctx.fillText('ZONE', bx + 28, by + 79);
        ctx.fillStyle = '#ffd600';
        ctx.fillText('ZONE', bx + 25, by + 76);

        if (tc.isBossAct) {
            ctx.font = 'bold 13px Courier New';
            ctx.fillStyle = '#ff5252';
            ctx.fillText('★ BOSS ACT ★', bx + 112, by + 75);
        }

        // 3. Golden Act Medallion on the right end of the bar
        const mx = bx + bw - 68, my = by + 50;
        ctx.fillStyle = '#ffd600';
        ctx.beginPath(); ctx.arc(mx, my, 46, 0, TAU); ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#081434';
        ctx.stroke();
        ctx.fillStyle = '#081434';
        ctx.textAlign = 'center';
        ctx.font = 'bold 13px Courier New';
        ctx.fillText('ACT', mx, my - 14);
        ctx.font = 'bold 42px Courier New';
        ctx.fillStyle = '#d50000';
        ctx.fillText(String(tc.act), mx + 2, my + 24);
        ctx.fillStyle = '#081434';
        ctx.fillText(String(tc.act), mx, my + 22);

        ctx.restore();
    }

    /** Live mini-map at bottom-left using the uploaded Sonic CD `palmtree_map.png`! */
    drawZoneMapRadar(ctx) {
        if (!this.mapImgLoaded) return;
        const mw = 260, mh = 26, mx = 12, my = this.H - 64;
        this.panel(ctx, mx - 2, my - 2, mw + 4, mh + 4);
        ctx.drawImage(this.mapImg, mx, my, mw, mh);
        const px = mx + clamp01(this.player.x / this.terrain.endX) * mw;
        const py = my + clamp01((this.player.y - 180) / 620) * mh;
        if (Math.floor(performance.now() / 180) % 2 === 0) {
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        }
    }

    drawHUD(ctx) {
        const p = this.player;
        const deg = toDeg(p.angle);
        this.panel(ctx, 12, 140, 292, 246);
        ctx.font = 'bold 12px Courier New'; ctx.fillStyle = '#ffd700';
        ctx.fillText('SONIC RETRO PHYSICS — DEBUG', 24, 159);
        ctx.font = '12px Courier New';
        const absG = Math.abs(p.gsp);
        const rows = [
            ['STATE', p.state + (p.curled ? ' (ball)' : ''), p.state === STATE.SPINDASH ? '#ff7a33' : p.state === STATE.ROLLING ? '#00e5ff' : '#fff'],
            ['GSP', p.gsp.toFixed(3), absG >= PHYS.TOP ? '#ffcc00' : absG >= PHYS.FALL_THRESHOLD ? '#5dff5d' : '#ff6b6b'],
            ['XSP / YSP', `${p.xsp.toFixed(2)} / ${p.ysp.toFixed(2)}`, '#fff'],
            ['ANGLE', deg.toFixed(1) + '°', '#5dff5d'],
            ['QUAD MODE', `${p.mode} (${MODE_NAMES[p.mode]})`, '#ffa53d'],
            ['LOOP LAYER', String(p.layer), p.layer === 0 ? '#00e5ff' : '#ff3dd0'],
            ['CTRL LOCK', p.controlLock > 0 ? `${Math.ceil(p.controlLock)} frames` : '0', p.controlLock > 0 ? '#ff4d4d' : '#5dff5d'],
            ['SPIN REV', `${p.spindashRev.toFixed(2)} / 8`, p.spindashRev > 0 ? '#ff7a33' : '#888'],
            ['AIR MOTION', p.grounded ? '—' : p.airMotion, '#bbb'],
        ];
        let y = 178;
        for (const [k, v, c] of rows) {
            ctx.fillStyle = '#9cdcfe'; ctx.fillText(k, 24, y);
            ctx.fillStyle = c; ctx.fillText(v, 136, y);
            y += 18;
        }
        let x = 24; y += 4;
        ctx.font = 'bold 11px Courier New';
        for (const k of ['A', 'B', 'C', 'D', 'E', 'F']) {
            ctx.fillStyle = SENSOR_COLORS[k]; ctx.fillRect(x, y - 9, 10, 10);
            ctx.fillText(k, x + 13, y); x += 40;
        }
        ctx.font = '10px Courier New'; ctx.fillStyle = '#8a9bb0';
        ctx.fillText(`FPS ${this.fps} · x ${p.x.toFixed(0)} y ${p.y.toFixed(0)}`, 24, y + 18);
    }

    drawControlsHint(ctx) {
        const txt = '←/→ run  ↓ roll  Space/Z jump  ↓+Jump spin dash  1–7 checkpoints  T time era  M zone  Tab debug  R reset';
        ctx.font = '11px Courier New';
        const w = ctx.measureText(txt).width + 20;
        this.panel(ctx, (this.W - w) / 2, this.H - 30, w, 22);
        ctx.fillStyle = '#cfe6ff'; ctx.fillText(txt, (this.W - w) / 2 + 10, this.H - 15);
    }
}

function crough(c) { return c * 0.6; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

window.addEventListener('DOMContentLoaded', () => { window.sonicGame = new Game(); });
</script>
